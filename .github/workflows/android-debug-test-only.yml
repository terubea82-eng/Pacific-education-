name: Android Debug Test APK Only

# Manual-only safety workflow. Select the source branch when dispatching.
# This workflow builds only the isolated .debug application package.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacedu-android-debug-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-test-only:
    name: Build isolated debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Build debug APK only
        working-directory: android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify isolated debug package identity
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          badging=$("${ANDROID_HOME}/build-tools/36.0.0/aapt2" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='fj.pacificeducation.app.debug'"
          if printf '%s\n' "$badging" | grep -Fq "package: name='fj.pacificeducation.app'"; then
            echo "Refusing an APK that could replace the installed production-package app." >&2
            exit 1
          fi
          sha256sum "$apk"

      - name: Upload debug test APK only
        uses: actions/upload-artifact@v4
        with:
          name: pacedu-android-debug-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
