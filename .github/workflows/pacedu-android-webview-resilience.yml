name: PacEdu Android WebView Persistence Resilience

on:
  push:
    branches:
      - backend/trusted-sync-staging-20261110
    paths:
      - "android/**"
      - ".github/workflows/pacedu-android-webview-resilience.yml"

permissions:
  contents: read

concurrency:
  group: pacedu-android-webview-resilience
  cancel-in-progress: false

jobs:
  android-webview-process-restart:
    name: Real Android WebView IndexedDB process-restart test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          ref: backend/trusted-sync-staging-20261110

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Run against Android Emulator WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            bash -euo pipefail <<'PACEDU_BASH'
            echo 'WEBVIEW_RECOVERY_GATE=REQUIRED'
            echo 'PHASE=EMULATOR_DEVICE_READY_WAIT'
            timeout 120s adb wait-for-device
            timeout 180s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = "1" ]; do sleep 2; done'
            echo 'PHASE=EMULATOR_BOOT_CONFIRMED'
            cd android
            echo 'PHASE=INDEXEDDB_WRITE_TEST_START'
            timeout --signal=TERM --kill-after=30s 15m gradle --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=fj.pacificeducation.app.PaceduAndroidWebViewPersistenceTest#writeRecordBeforeProcessRestart
            echo 'PHASE=INDEXEDDB_WRITE_TEST_PASSED'
            echo 'PHASE=ANDROID_FORCE_STOP_START'
            timeout --signal=TERM --kill-after=10s 45s adb shell am force-stop fj.pacificeducation.app.debug
            echo 'PHASE=ANDROID_FORCE_STOP_CONFIRMED'
            echo 'PHASE=INDEXEDDB_RECOVERY_TEST_START'
            timeout --signal=TERM --kill-after=30s 15m gradle --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=fj.pacificeducation.app.PaceduAndroidWebViewPersistenceTest#readRecordAfterProcessRestart
            echo 'PHASE=INDEXEDDB_RECOVERY_TEST_PASSED'
            echo 'WEBVIEW_RECOVERY_GATE=PASSED; expected marker PACEDU_WEBVIEW_PERSISTED recovered as READ_OK'
            PACEDU_BASH
