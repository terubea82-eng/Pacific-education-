name: PacEdu dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pacedu-dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pacedu-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacedu-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Clean install and full dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly from lockfile
        run: npm ci
      - name: Audit all installed dependencies
        run: npm audit --audit-level=high
