name: Pacific Guardian Controlled Stage Write

on:
  workflow_dispatch:
  push:
    paths:
      - "automation/stage-completion.json"
      - "automation/pacificGuardianStageWriteCheck.js"
      - "PACIFIC_GUARDIAN_AUTOMATED_STAGE_WRITE_POLICY.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stage completion
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          result="$(node automation/pacificGuardianStageWriteCheck.js automation/stage-completion.json)"
          echo "$result"
          eligible="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.eligible))' "$result")"
          stage="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.stage ?? ""))' "$result")"
          class="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.changeClass ?? ""))' "$result")"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "change_class=$class" >> "$GITHUB_OUTPUT"

      - name: Stop safely when the stage is not completed
        if: steps.gate.outputs.eligible != 'true'
        run: echo "NO AUTOMATIC WRITE — completion evidence did not satisfy the fail-closed gate."

      - name: Prepare controlled Class A record
        if: steps.gate.outputs.eligible == 'true' && steps.gate.outputs.change_class == 'A'
        env:
          STAGE: ${{ steps.gate.outputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/generated
          cat > "automation/generated/STAGE_${STAGE}_GUARDIAN_WRITE.md" <<EOF
          # Pacific Guardian Stage ${STAGE} Automatic Write Record

          This file was prepared by the controlled Pacific Guardian automation.

          - Stage: ${STAGE}
          - Change class: A
          - Production authorization: NOT GRANTED
          - Legal/Ministry approval: NOT GRANTED
          - Production deployment: NOT PERFORMED

          The record is generated only after the repository's stage-completion gate passes.
          EOF

      - name: Validate generated change
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          node --check automation/pacificGuardianStageWriteCheck.js
          test -f automation/stage-completion.json

      - name: Open review pull request
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ steps.gate.outputs.stage }}
          CLASS: ${{ steps.gate.outputs.change_class }}
        shell: bash
        run: |
          set -euo pipefail
          branch="pacific-guardian/stage-${STAGE}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "Pacific Guardian Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/generated/
          git commit -m "Pacific Guardian: record completed Stage ${STAGE}"
          git push --set-upstream origin "$branch"
          gh pr create             --base main             --head "$branch"             --title "Pacific Guardian: completed Stage ${STAGE} controlled write"             --body "Automated Class ${CLASS} stage write. Required evidence passed the fail-closed gate. This PR does not grant production approval, legal compliance, Ministry approval, or production deployment."
