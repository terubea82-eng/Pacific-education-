name: Pacific Education Signed Android Release
on: {workflow_dispatch:}
jobs:
  signed-release:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.6.0"}
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
      - name: Restore keystore
        env: {KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pacific-education-release.jks"
      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease
        working-directory: android
      - name: Verify signed AAB
        run: jarsigner -verify -verbose android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-signed-v1.0.1
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
