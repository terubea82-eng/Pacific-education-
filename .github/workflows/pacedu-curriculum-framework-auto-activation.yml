name: PacEdu Curriculum Framework Auto Activation

on:
  schedule:
    - cron: "11 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/curriculum-releases/**"
      - "automation/curriculum_release_activation.py"
      - "src/data/curriculum/generated/**"
      - "src/data/curriculum/active-frameworks.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pacedu-curriculum-framework-activation
  cancel-in-progress: false

jobs:
  validate-and-activate:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release records and tests
        run: |
          set -euo pipefail
          python3 tests/test_education_change_registry.py
          python3 automation/curriculum_release_activation.py --check-only

      - name: Activate verified releases whose effective date has arrived
        run: python3 automation/curriculum_release_activation.py

      - name: Commit active framework manifest when changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/curriculum/active-frameworks.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No curriculum activation due."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/curriculum/active-frameworks.json
          git commit -m "curriculum: activate verified framework release"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages for framework activation
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site with new active framework manifest
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy active framework to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
