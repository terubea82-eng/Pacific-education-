name: Pacific Education Daily Current Affairs Feed
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-current-affairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch education current affairs from approved domains
        run: |
          set -euo pipefail
          mkdir -p docs/data
          # GDELT can throttle shared CI IPs. Identify the client and retry slowly.
          # Keep requests spaced apart; never replace the feed if any request fails.
          for domain in unesco.org unicef.org un.org who.int; do
            echo "Querying GDELT for $domain"
            curl --fail --show-error --location --connect-timeout 15 --max-time 60 \
              --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 240 \
              --user-agent 'PacificEducationPilot/1.0 (educational current-affairs feed; contact: repository maintainer)' \
              --header 'Accept: application/json' \
              --get 'https://api.gdeltproject.org/api/v2/doc/doc' \
              --data-urlencode "query=(education OR school OR learning OR teacher) domain:$domain" \
              --data-urlencode 'mode=artlist' \
              --data-urlencode 'maxrecords=100' \
              --data-urlencode 'timespan=1week' \
              --data-urlencode 'sort=datedesc' \
              --data-urlencode 'format=json' \
              -o "/tmp/gdelt-$domain.json"
            # Avoid bursting requests against the public endpoint.
            sleep 10
          done
          node <<'NODE'
          const fs = require('fs');
          const { URL } = require('url');
          const domains = ['unesco.org', 'unicef.org', 'un.org', 'who.int'];
          const allArticles = [];
          for (const domain of domains) {
            const body = fs.readFileSync('/tmp/gdelt-' + domain + '.json', 'utf8');
            let raw;
            try { raw = JSON.parse(body); }
            catch (_) { throw new Error('Invalid JSON from GDELT for ' + domain + '; preserving existing feed. Body: ' + body.slice(0, 200)); }
            if (!raw || !Array.isArray(raw.articles)) {
              throw new Error('Unexpected GDELT response for ' + domain + ' (keys: ' + Object.keys(raw || {}).join(',') + '; body: ' + body.slice(0, 200) + '); preserving existing feed.');
            }
            console.log(domain + ': received ' + raw.articles.length + ' candidate articles');
            allArticles.push(...raw.articles);
          }
          const approvedHosts = domains;
          function approvedUrl(value) {
            try {
              const u = new URL(String(value || ''));
              return u.protocol === 'https:' &&
                approvedHosts.some(host => u.hostname === host || u.hostname.endsWith('.' + host));
            } catch (_) { return false; }
          }
          function subjects(title) {
            const t = String(title || '').toLowerCase(), s = [];
            if (/literacy|reading|language|english|teacher|school/.test(t)) s.push('English');
            if (/math|mathematics|number|data/.test(t)) s.push('Mathematics');
            if (/science|health|disease|climate|environment|disaster/.test(t)) s.push('Science', 'Health Science');
            if (/technology|digital|internet|computer|ai/.test(t)) s.push('Computer Studies');
            if (/community|society|government|education system|poverty|displacement/.test(t)) s.push('Social Science');
            if (/place|country|climate|environment|migration/.test(t)) s.push('Geography');
            if (/history|heritage|conflict|war/.test(t)) s.push('History');
            if (/art|music|culture/.test(t)) s.push('Arts');
            return [...new Set(s)];
          }
          const seen = new Set();
          const items = allArticles.map((a, i) => {
            const title = String(a.title || '').trim();
            const url = String(a.url || '').trim();
            if (!title || !approvedUrl(url) || seen.has(url)) return null;
            seen.add(url);
            return {
              id: 'GDELT-' + Buffer.from(url || title || String(i)).toString('base64url').slice(0, 48),
              title,
              url,
              source: String(a.domain || a.sourcecountry || 'Approved educational news source').trim(),
              publishedAt: String(a.seendate || '').trim(),
              topic: 'Education and learning',
              educationalRelevance: 'Potentially relevant to teaching, learning, health, inclusion, science, environment, or education systems.',
              ageSuitability: 'Teacher/reviewer screening required before student use.',
              subjectsApplicable: subjects(title),
              levelsApplicable: [],
              verificationStatus: 'PENDING_TEACHER_REVIEW',
              approved: false,
              sourceType: 'EDUCATIONAL_CURRENT_AFFAIRS'
            };
          }).filter(Boolean).sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt))).slice(0, 30);
          if (items.length === 0) {
            throw new Error('No eligible HTTPS articles from approved domains; preserving existing feed.');
          }
          const out = {
            version: '1.0.0',
            generatedAt: new Date().toISOString(),
            source: 'GDELT DOC API queried separately for UNESCO, UNICEF, UN and WHO domains',
            items
          };
          fs.writeFileSync('docs/data/current-affairs.json', JSON.stringify(out, null, 2) + '\n');
          console.log('Validated ' + items.length + ' articles; all remain pending teacher review.');
          NODE
      - name: Commit feed when changed
        run: |
          git config user.name "pacific-education-bot"
          git config user.email "actions@github.com"
          git add docs/data/current-affairs.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh daily educational current affairs feed"
          git push
