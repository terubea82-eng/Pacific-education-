name: Pacific Education Pilot Recheck

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "js/**"
      - "docs/**"
      - "PILOT_100_USER_APK_DISTRIBUTION.md"
      - "PILOT_READY_CHECKLIST.md"
      - "404.html"
      - "release/production-authorization.json"
      - "automation/**"
      - ".github/workflows/pilot-recheck.yml"
      - ".github/workflows/deploy-pilot-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required pilot files
        run: |
          set -e
          test -f src/index.html
          test -f src/js/pacificEducationPilotUserWorkspaces.js
          test -f PILOT_100_USER_APK_DISTRIBUTION.md
          test -f PILOT_READY_CHECKLIST.md
          test -f release/production-authorization.json

      - name: Verify all eight pilot roles are wired
        run: |
          set -e
          roles="student teacher parent professional ngo education community owner"
          for role in $roles; do
            grep -Fq 'id:"'$role'"' src/js/pacificEducationPilotUserWorkspaces.js
          done
          grep -Fq 'pacificEducationPilotUserWorkspaces.js' src/index.html

      - name: Verify production remains fail-closed
        run: |
          set -e
          grep -q '"productionApproved": false' release/production-authorization.json
          grep -q '"productionEligible": false' release/production-authorization.json
          grep -q '"release_status": "BLOCKED"' release/production-authorization.json

      - name: Verify live pilot links
        run: |
          set -e
          sleep 60
          root_code=$(curl -sSL --retry 12 --retry-delay 5 -o /tmp/pacific-root.html -w "%{http_code}" "https://terubea82-eng.github.io/Pacific-education-/?pilot_recheck=1" || true)
          src_code=$(curl -sSL --retry 12 --retry-delay 5 -o /tmp/pacific-src.html -w "%{http_code}" "https://terubea82-eng.github.io/Pacific-education-/src/index.html?pilot_recheck=1" || true)
          echo "GitHub Pages root HTTP status: $root_code"
          echo "GitHub Pages /src/index.html HTTP status: $src_code"
          if [ "$root_code" = "200" ] && [ "$src_code" = "200" ]; then
            grep -q "src/index.html" /tmp/pacific-root.html
            grep -q "Pilot User Workspaces" /tmp/pacific-src.html
            grep -q "Pacific Education" /tmp/pacific-src.html
          else
            echo "::error::GitHub Pages root or /src/index.html did not return HTTP 200."
            exit 1
          fi

      - name: Publish recheck summary
        run: |
          {
            echo "## Pacific Education pilot recheck"
            echo "- Required pilot files: PASS"
            echo "- Eight pilot roles wired: PASS"
            echo "- Production gate remains BLOCKED: PASS"
            echo "- GitHub Pages deployment: verified by the Pages workflow; external HTTP check may lag propagation"
            echo ""
            echo "Pilot URL: https://terubea82-eng.github.io/Pacific-education-/"
          } >> "$GITHUB_STEP_SUMMARY"
