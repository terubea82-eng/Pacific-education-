
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education Pricing Audit Guard Test</title>
</head>

<body>

    <h1>
        Pacific Education — Pricing Audit Guard Test
    </h1>

    <p>
        TEST ONLY — This page does not create production prices
        or process payments.
    </p>

    <pre id="result">
Running pricing audit guard test...
    </pre>

    <script src="js/pacificEducationAnnualGdpPricingEngine.js"></script>

    <script src="js/pacificEducationPricingAuditGuard.js"></script>

    <script src="js/pacificEducationPricingAuditGuardTest.js"></script>

    <script>
        (function () {
            "use strict";

            const output =
                document.getElementById("result");

            const testResult =
                window.PacificEducationPricingAuditGuardTestResult;

            if (!testResult) {
                output.textContent =
                    "TEST FAILED: Pricing Audit Guard result unavailable.";
                return;
            }

            output.textContent =
                JSON.stringify(
                    testResult,
                    null,
                    2
                );
        })();
    </script>

</body>
</html>
