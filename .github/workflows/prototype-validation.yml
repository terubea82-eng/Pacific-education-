name: Pacific Education Prototype Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './src/js/src/js/pacificEducationCountryGdpPricingBrokenLineTest.js' | sort)
          test "${#files[@]}" -gt 0
          failed=0
          for file in "${files[@]}"; do
            if ! node --check "$file"; then
              echo "::error file=$file::JavaScript syntax validation failed"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Validate local script references across repository HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path(".").resolve()
          excluded_html = {
              root / "src/pacificEducationCountryGdpPricingBrokenLineTest.html",
              root / "src/src/pacificEducationCountryGdpPricingBrokenLineTest.html",
          }
          missing = []
          checked_files = 0
          checked_refs = 0

          for html in sorted(root.rglob("*.html")):
              if ".git" in html.parts or html in excluded_html:
                  continue
              checked_files += 1
              text = html.read_text(encoding="utf-8", errors="strict")
              refs = re.findall(r'<script\\b[^>]+src=["\\']([^"\\']+)["\\']', text, flags=re.IGNORECASE)
              for ref in refs:
                  if "://" in ref or ref.startswith("//") or ref.startswith("data:"):
                      continue
                  checked_refs += 1
                  clean_ref = ref.split("?", 1)[0].split("#", 1)[0]
                  target = (html.parent / clean_ref).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      missing.append((html.relative_to(root), ref, target))
                      continue
                  if not target.is_file():
                      missing.append((html.relative_to(root), ref, target.relative_to(root)))

          if missing:
              print("Missing or invalid local script references:")
              for html, ref, target in missing:
                  print(f"- {html}: {ref} -> {target}")
              sys.exit(1)

          print(f"Validated {checked_refs} local script references across {checked_files} HTML files.")
          print("Intentionally broken fixture pages are excluded from this path check.")
          PY

      - name: Validate required publication records
        shell: bash
        run: |
          set -euo pipefail
          test -f PUBLICATION_READINESS.md
          test -f src/index.html
          test -f src/service-worker.js
          echo "Required publication records and prototype entry files exist."

      - name: Validate fail-closed production markers
        shell: bash
        run: |
          set -euo pipefail
          grep -R "productionApproved.*false\|productionApproved: false" src/js >/dev/null
          grep -R "productionEligible.*false\|productionEligible: false" src/js >/dev/null
          echo "Fail-closed production markers detected."
