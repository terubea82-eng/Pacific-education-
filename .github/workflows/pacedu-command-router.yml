name: Pacedu Authenticated Command Router

on:
  push:
    paths:
      - ".github/workflows/pacedu-command-router.yml"
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [pacedu-command]
  workflow_dispatch:
    inputs:
      command:
        description: "Owner-authorized Pacedu operation"
        required: true
        type: choice
        options:
          - help
          - check
          - test
          - device-test
          - build-android
          - deploy-web
          - preserve-check

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: pacedu-command-router
  cancel-in-progress: false

jobs:
  validate-router:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify allowlisted routes and owner guard
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/pacedu-command-router.yml
          grep -q "github.actor == 'terubea82-eng'" "$file"
          grep -q "repository_dispatch:" "$file"
          grep -q "DISPATCH_COMMAND" "$file"
          grep -q "actions: write" "$file"
          grep -q "help|check|test|device-test|activate|build-android|deploy-web|preserve-check" "$file"
          grep -q "dispatch_and_wait pacedu-cross-device-test.yml" "$file"
          grep -q "dispatch_and_wait android-pilot-build.yml" "$file"
          grep -q "dispatch_and_wait deploy-pilot-pages.yml" "$file"
          grep -q "dispatch_and_wait pacedu-voice-lock.yml" "$file"
          grep -q "Downstream workflow completed successfully" "$file"
          echo "PASS: command router has owner gate, allowlisted mappings, and downstream completion checks."

  route:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'pacedu-command') ||
      (github.event.issue.pull_request == null &&
       github.actor == 'terubea82-eng' &&
       startsWith(github.event.comment.body, '/pacedu '))
    runs-on: ubuntu-latest
    steps:
      - name: Validate requester and parse allowlisted command
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_COMMAND: ${{ inputs.command }}
          DISPATCH_COMMAND: ${{ github.event.client_payload.command }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" && "$ACTOR" != "terubea82-eng" ]]; then
            echo "Rejected: only the repository owner may issue Pacedu commands."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            command="$INPUT_COMMAND"
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            command="$DISPATCH_COMMAND"
          else
            command="$(printf '%s\n' "$COMMENT_BODY" | sed -n '1{s#^/pacedu[[:space:]]\+##;p;}')"
            command="${command%%[[:space:]]*}"
          fi
          case "$command" in
            help|check|test|device-test|activate|build-android|deploy-web|preserve-check) ;;
            *)
              echo "Unsupported command. Allowed: help, check, test, activate, build-android, deploy-web, preserve-check."
              exit 2
              ;;
          esac
          echo "command=$command" >> "$GITHUB_OUTPUT"

      - name: Run approved workflow and verify its actual result
        id: downstream
        if: steps.parse.outputs.command != 'help'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMAND: ${{ steps.parse.outputs.command }}
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/pacedu-downstream-summary.txt"
          : > "$summary_file"

          dispatch_and_wait() {
            local workflow="$1"
            local label="$2"
            local before_ids run_json run_id run_status run_conclusion run_url
            before_ids="$(gh run list --workflow "$workflow" --event workflow_dispatch --branch main --json databaseId --limit 30 | jq '[.[].databaseId]')"
            echo "Dispatching $label ($workflow)..."
            gh workflow run "$workflow" --ref main
            # Allow GitHub's Actions API to publish the newly dispatched run.
            sleep 3
            started_at="$(date -u +%s)"
            run_json=""
            for attempt in $(seq 1 360); do
              run_json="$(gh run list --workflow "$workflow" --event workflow_dispatch --branch main --json databaseId,status,conclusion,createdAt,url --limit 30)"
              run_json="$(printf '%s' "$run_json" | jq -c --argjson before "$before_ids" '[.[] | select((.databaseId as $id | ($before | index($id)) == null)] | sort_by(.createdAt) | last // empty')"
              if [[ -n "$run_json" && "$run_json" != "null" ]]; then
                break
              fi
              sleep 2
            done
            if [[ -z "$run_json" || "$run_json" == "null" ]]; then
              echo "::error::No downstream run appeared for $workflow after dispatch."
              return 1
            fi

            run_id="$(printf '%s' "$run_json" | jq -r '.databaseId')"
            run_url="$(printf '%s' "$run_json" | jq -r '.url')"
            for attempt in $(seq 1 900); do
              run_json="$(gh run view "$run_id" --json databaseId,status,conclusion,url)"
              run_status="$(printf '%s' "$run_json" | jq -r '.status')"
              run_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"
              run_url="$(printf '%s' "$run_json" | jq -r '.url')"
              if [[ "$run_status" == "completed" ]]; then
                break
              fi
              sleep 3
            done
            if [[ "$run_status" != "completed" ]]; then
              echo "::error::Timed out waiting for $label (run $run_id)."
              printf '%s: TIMEOUT — %s\n' "$label" "$run_url" | tee -a "$summary_file"
              return 1
            fi
            printf '%s: %s — %s\n' "$label" "$run_conclusion" "$run_url" | tee -a "$summary_file"
            if [[ "$run_conclusion" != "success" ]]; then
              echo "::error::$label did not succeed (run $run_id; conclusion=$run_conclusion)."
              return 1
            fi
            echo "Downstream workflow completed successfully: $label (run $run_id)."
          }

          case "$COMMAND" in
            check)
              dispatch_and_wait pilot-recheck.yml "Pilot recheck"
              ;;
            test)
              dispatch_and_wait pilot-preflight.yml "Pilot preflight"
              dispatch_and_wait pacedu-feature-preservation.yml "Feature preservation"
              dispatch_and_wait pacedu-cross-device-test.yml "Desktop and phone browser software tests"
              ;;
            device-test)
              dispatch_and_wait pacedu-cross-device-test.yml "Desktop and phone browser software tests"
              ;;
            activate)
              dispatch_and_wait pilot-preflight.yml "Pilot preflight"
              dispatch_and_wait pacedu-feature-preservation.yml "Feature preservation"
              dispatch_and_wait pacedu-voice-lock.yml "Protected #856 voice lock"
              dispatch_and_wait pacedu-cross-device-test.yml "Desktop and phone browser software tests"
              dispatch_and_wait deploy-pilot-pages.yml "GitHub Pages deployment"
              dispatch_and_wait pilot-recheck.yml "Post-deployment pilot recheck"
              dispatch_and_wait android-pilot-build.yml "Android pilot build"
              ;;
            build-android)
              dispatch_and_wait android-pilot-build.yml "Android pilot build"
              ;;
            deploy-web)
              dispatch_and_wait deploy-pilot-pages.yml "GitHub Pages deployment"
              dispatch_and_wait pilot-recheck.yml "Post-deployment pilot recheck"
              ;;
            preserve-check)
              dispatch_and_wait pacedu-feature-preservation.yml "Feature preservation"
              dispatch_and_wait pacedu-voice-lock.yml "Protected voice lock"
              ;;
            *)
              echo "No workflow is mapped for this command."
              exit 2
              ;;
          esac
          {
            echo "Downstream workflow verification: PASS"
            cat "$summary_file"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary<<PACEDU_SUMMARY_EOF"
            cat "$summary_file"
            echo "PACEDU_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report help or command result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND: ${{ steps.parse.outputs.command }}
          JOB_STATUS: ${{ job.status }}
          DOWNSTREAM_SUMMARY: ${{ steps.downstream.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "issue_comment" || -z "${ISSUE_NUMBER:-}" ]]; then
            echo "Command: $COMMAND; router status: $JOB_STATUS"
            exit 0
          fi
          if [[ "$COMMAND" == "help" || -z "$COMMAND" ]]; then
            body=$'Pacedu owner command router\n\nAllowed comments (owner account only):\n- `/pacedu check` — trigger pilot recheck\n- `/pacedu test` — run pilot preflight, feature-preservation and desktop/phone browser software tests\n- `/pacedu device-test` — run Playwright browser interaction checks for desktop and phone-sized layouts, including speech API invocation\n- `/pacedu activate` — run preflight, preserve the #856 voice lock, deploy Pages, recheck live links, and build the Android pilot APK/AAB; fail if any downstream workflow fails\n- `/pacedu build-android` — trigger Android pilot build\n- `/pacedu deploy-web` — deploy the current main branch to Pages\n- `/pacedu preserve-check` — trigger protected-feature and voice-lock checks\n- `/pacedu help` — show this list\n\nThis router runs only these allowlisted workflows. It does not execute arbitrary shell/code or automatically receive messages from ChatGPT.'
          else
            if [[ "$JOB_STATUS" == "success" && -n "${DOWNSTREAM_SUMMARY:-}" ]]; then
              printf -v body 'Pacedu command `%s` result: SUCCESS. Downstream workflow(s) completed successfully:\n%s\nAutomated checks and deployment results are shown in the linked run(s); phone speaker output and physical-device behaviour still require a device test.' "$COMMAND" "$DOWNSTREAM_SUMMARY"
            else
              printf -v body 'Pacedu command `%s` result: %s. The downstream workflow did not confirm success. Open Actions logs to inspect the failure.' "$COMMAND" "$JOB_STATUS"
            fi
          fi
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments" -f body="$body"
