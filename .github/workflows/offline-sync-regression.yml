name: Offline Sync Regression

on:
  workflow_dispatch:
  push:
    paths:
      - "service-worker.js"
      - "src/js/pacificEducationOfflineRuntime.js"
      - "src/js/pacificEducationOfflineSyncController.js"
      - "tests/offline-sync-regression.test.js"
      - "tests/offline-sync-ui-regression.test.js"
      - "tests/service-worker-regression.test.js"
      - "docs/LOW-CONNECTIVITY-TESTING.md"
      - "package.json"
      - ".github/workflows/offline-sync-regression.yml"
  pull_request:
    paths:
      - "service-worker.js"
      - "src/js/pacificEducationOfflineRuntime.js"
      - "src/js/pacificEducationOfflineSyncController.js"
      - "tests/offline-sync-regression.test.js"
      - "tests/offline-sync-ui-regression.test.js"
      - "tests/service-worker-regression.test.js"
      - "docs/LOW-CONNECTIVITY-TESTING.md"
      - "package.json"
      - ".github/workflows/offline-sync-regression.yml"

permissions:
  contents: read

jobs:
  offline-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run offline sync regression tests
        run: npm test
