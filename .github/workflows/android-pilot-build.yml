name: Android Pilot Build
# Controlled pilot build.
# Latest pilot verification trigger.
# Final pilot APK rebuild from protected #856 candidate.
# Latest main verification after offline conflict regression repair. Release signing is enabled only when owner-controlled
# GitHub Actions signing secrets are present; the keystore is never committed.
# Rebuilds on pilot web, Android, and workflow changes so current main is packaged.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "js/**"
      - "tests/**"
      - "automation/**"
      - "package.json"
      - ".github/workflows/android-pilot-build.yml"
permissions:
  contents: write
concurrency:
  group: pacedu-public-pilot-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACIFIC_SIGNING_READY: ${{ secrets.PACIFIC_KEYSTORE_BASE64 != '' && secrets.PACIFIC_KEYSTORE_PASSWORD != '' && secrets.PACIFIC_KEY_ALIAS != '' && secrets.PACIFIC_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Verify Gradle
        working-directory: android
        run: gradle --version
      - name: Validate owner signing keystore secret
        if: ${{ env.PACIFIC_SIGNING_READY == 'true' }}
        env:
          PACIFIC_KEYSTORE_BASE64: ${{ secrets.PACIFIC_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PACIFIC_KEYSTORE_BASE64" | tr -d '[:space:]' > "${RUNNER_TEMP}/pacific-keystore.b64"
          chars=$(wc -c < "${RUNNER_TEMP}/pacific-keystore.b64")
          test "$chars" -gt 0
          test $((chars % 4)) -eq 0
          base64 --decode "${RUNNER_TEMP}/pacific-keystore.b64" > "${RUNNER_TEMP}/pacific-education-release.jks"
          test -s "${RUNNER_TEMP}/pacific-education-release.jks"
      - name: Clean Android outputs
        working-directory: android
        run: gradle --no-daemon clean
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PACIFIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PACIFIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PACIFIC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PACIFIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PACIFIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PACIFIC_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease
      - name: Verify pilot APK outputs
        working-directory: android
        run: |
          set -e
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          release_unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$debug_apk"
          test -s "$release_apk" || test -s "$release_unsigned"
          debug_badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$debug_apk")
          printf '%s\n' "$debug_badging" | grep -Eq "package: name='fj\.pacificeducation\.app(\.debug)?'"
          if [ -s "$release_apk" ]; then
            release_badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$release_apk")
            printf '%s\n' "$release_badging" | grep -F "package: name='fj.pacificeducation.app'"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$release_apk"
          else
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$release_unsigned" | grep -F "package: name='fj.pacificeducation.app'"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$debug_apk"
      - name: Identify release signing state
        run: |
          if [ -s "${RUNNER_TEMP}/pacific-education-release.jks" ]; then echo "PILOT_SIGNING_STATE=signed" >> "${GITHUB_ENV}"; else echo "PILOT_SIGNING_STATE=unsigned" >> "${GITHUB_ENV}"; fi
      - name: Create pilot package
        run: |
          mkdir -p pilot-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk pilot-artifacts/pacific-education-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk pilot-artifacts/pacific-education-release.apk; else cp android/app/build/outputs/apk/release/app-release-unsigned.apk pilot-artifacts/pacific-education-release-unsigned.apk; fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab pilot-artifacts/pacific-education-release.aab; else cp android/app/build/outputs/bundle/release/app-release-unsigned.aab pilot-artifacts/pacific-education-release-unsigned.aab; fi
          printf 'PILOT_SIGNING_STATE=%s\n' "${PILOT_SIGNING_STATE:-unknown}" > pilot-artifacts/SIGNING_STATE.txt
          sha256sum pilot-artifacts/* > pilot-artifacts/SHA256SUMS.txt
      - name: Upload pilot package
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-100-user-pilot
          path: pilot-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-aab
          path: android/app/build/outputs/bundle/release/app-release*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Prepare public APK
        run: |
          mkdir -p public-release
          cp android/app/build/outputs/apk/debug/app-debug.apk public-release/pacific-education-debug.apk
          sha256sum public-release/pacific-education-debug.apk > public-release/SHA256SUMS.txt
          printf '%s\n' "Commit: ${GITHUB_SHA}" >> public-release/SHA256SUMS.txt
      - name: Publish public pilot APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view pilot-public >/dev/null 2>&1; then
            gh release upload pilot-public public-release/pacific-education-debug.apk public-release/SHA256SUMS.txt --clobber
            gh release edit pilot-public --title "Pacific Education Pilot — Public APK" --notes "Controlled pilot APK. Latest successful Android pilot build is refreshed by CI. Protected #856 voice system and current pilot changes are preserved." --prerelease
          else
            gh release create pilot-public public-release/pacific-education-debug.apk public-release/SHA256SUMS.txt \
              --target "${{ github.sha }}" \
              --title "Pacific Education Pilot — Public APK" \
              --notes "Controlled pilot APK built from ${{ github.sha }}. Protected #856 voice system and current pilot changes are preserved." \
              --prerelease
          fi
