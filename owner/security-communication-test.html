<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacific Education — Owner Security Communication Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      line-height: 1.5;
    }

    button {
      font-size: 18px;
      padding: 12px 18px;
      margin: 6px 4px 6px 0;
    }

    pre {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 16px;
      border-radius: 8px;
    }

    .warning {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <h1>Pacific Education</h1>
  <h2>Owner Security Communication Test</h2>

  <p class="warning">
    OWNER/DEVELOPER TEST ONLY — NOT PART OF PRODUCTION STARTUP.
  </p>

  <p>
    This page runs the current Pacific Education secure communication
    security test harness. It does not modify the production application.
  </p>

  <button id="runTest" type="button">
    Run Security Test
  </button>

  <button id="resetTest" type="button">
    Reset Test State
  </button>

  <h3>Test Output</h3>

  <pre id="output">Ready. Press “Run Security Test”.</pre>

  <script src="../src/js/pacificEducationVerifiedEducationRelationship.js"></script>
  <script src="../js/pacificEducationSecureLinkAuthorization.js"></script>
  <script src="../js/pacificEducationSecureCommunication.js"></script>
  <script src="../js/pacificEducationSecureCommunicationTest.js"></script>

  <script>
    (function () {
      "use strict";

      const output =
        document.getElementById("output");

      function show(value) {
        if (typeof value === "string") {
          output.textContent = value;
          return;
        }

        try {
          output.textContent =
            JSON.stringify(value, null, 2);
        } catch (error) {
          output.textContent =
            String(value);
        }
      }

      function getTestHarness() {
        return (
          window.PacificEducationSecureCommunicationTest ||
          null
        );
      }

      document
        .getElementById("runTest")
        .addEventListener("click", function () {
          try {
            const test =
              getTestHarness();

            if (
              !test ||
              typeof test.runAllTests !== "function"
            ) {
              show(
                "ERROR: PacificEducationSecureCommunicationTest.runAllTests is not available."
              );
              return;
            }

            const report =
              test.runAllTests();

            show(report);
          } catch (error) {
            show(
              "TEST ERROR:\n" +
              (
                error &&
                error.stack
                  ? error.stack
                  : String(error)
              )
            );
          }
        });

      document
        .getElementById("resetTest")
        .addEventListener("click", function () {
          try {
            const test =
              getTestHarness();

            if (
              !test ||
              typeof test.resetTestState !== "function"
            ) {
              show(
                "ERROR: PacificEducationSecureCommunicationTest.resetTestState is not available."
              );
              return;
            }

            test.resetTestState();

            show(
              "Test state reset. Production application was not changed."
            );
          } catch (error) {
            show(
              "RESET ERROR:\n" +
              (
                error &&
                error.stack
                  ? error.stack
                  : String(error)
              )
            );
          }
        });
    })();
  </script>
</body>
</html>
