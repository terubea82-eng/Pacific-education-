name: Android Pilot Build
# Controlled pilot build. Release signing is enabled only when owner-controlled
# GitHub Actions signing secrets are present; the keystore is never committed.

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-pilot-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACIFIC_SIGNING_READY: ${{ secrets.PACIFIC_KEYSTORE_BASE64 != '' && secrets.PACIFIC_KEYSTORE_PASSWORD != '' && secrets.PACIFIC_KEY_ALIAS != '' && secrets.PACIFIC_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Verify Gradle
        working-directory: android
        run: gradle --version

      - name: Validate owner signing keystore secret
        if: ${{ env.PACIFIC_SIGNING_READY == 'true' }}
        env:
          PACIFIC_KEYSTORE_BASE64: ${{ secrets.PACIFIC_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PACIFIC_KEYSTORE_BASE64" | tr -d '[:space:]' > "${RUNNER_TEMP}/pacific-keystore.b64"
          chars=$(wc -c < "${RUNNER_TEMP}/pacific-keystore.b64")
          echo "Base64 payload length: ${chars} characters"
          if [ "$chars" -eq 0 ]; then
            echo "ERROR: PACIFIC_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          if ! grep -qE '^[A-Za-z0-9+/]*={0,2}$' "${RUNNER_TEMP}/pacific-keystore.b64"; then
            echo "ERROR: PACIFIC_KEYSTORE_BASE64 contains characters outside the Base64 alphabet."
            exit 1
          fi
          if [ $((chars % 4)) -ne 0 ]; then
            echo "ERROR: PACIFIC_KEYSTORE_BASE64 length is not a multiple of 4."
            exit 1
          fi
          if ! base64 --decode "${RUNNER_TEMP}/pacific-keystore.b64" > "${RUNNER_TEMP}/pacific-education-release.jks"; then
            echo "ERROR: PACIFIC_KEYSTORE_BASE64 cannot be decoded."
            exit 1
          fi
          test -s "${RUNNER_TEMP}/pacific-education-release.jks"
          echo "Base64 validation and keystore decoding succeeded."
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PACIFIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PACIFIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PACIFIC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PACIFIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PACIFIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PACIFIC_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Identify release signing state
        run: |
          if [ -s "${RUNNER_TEMP}/pacific-education-release.jks" ]; then
            echo "PILOT_SIGNING_STATE=signed" >> "${GITHUB_ENV}"
          else
            echo "PILOT_SIGNING_STATE=unsigned" >> "${GITHUB_ENV}"
          fi

      - name: Create pilot package
        run: |
          mkdir -p pilot-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk pilot-artifacts/pacific-education-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk pilot-artifacts/pacific-education-release.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk pilot-artifacts/pacific-education-release-unsigned.apk
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab pilot-artifacts/pacific-education-release.aab
          else
            cp android/app/build/outputs/bundle/release/app-release-unsigned.aab pilot-artifacts/pacific-education-release-unsigned.aab
          fi
          printf 'PILOT_SIGNING_STATE=%s\n' "${PILOT_SIGNING_STATE:-unknown}" > pilot-artifacts/SIGNING_STATE.txt
          sha256sum pilot-artifacts/* > pilot-artifacts/SHA256SUMS.txt

      - name: Upload pilot package
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-100-user-pilot
          path: pilot-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-aab
          path: android/app/build/outputs/bundle/release/app-release*.aab
          if-no-files-found: error
          retention-days: 30