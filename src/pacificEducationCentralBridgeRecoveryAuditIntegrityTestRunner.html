<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education Central Bridge Recovery Audit Integrity Test</title>
</head>

<body>
    <h1>Pacific Education Central Bridge Recovery Audit Integrity Test</h1>

    <div id="testOutput">
        Loading test...
    </div>

    <!-- =========================================================
         CENTRAL BRIDGE
         TESTING ONLY — NOT PRODUCTION AUTHORIZATION
         ========================================================= -->
    <script src="js/pacificEducationCentralBridge.js"></script>

    <!-- =========================================================
         RECOVERY AUDIT INTEGRITY TEST
         TEST ONLY — NOT PRODUCTION
         ========================================================= -->
    <script src="pacificEducationCentralBridgeRecoveryAuditIntegrityTest.js"></script>

    <script>
        (function () {
            "use strict";

            const output =
                document.getElementById("testOutput");

            if (
                !window
                    .PacificEducationCentralBridgeRecoveryAuditIntegrityTest
            ) {
                output.innerHTML =
                    "<h2>TEST LOAD ERROR</h2>" +
                    "<p>" +
                    "The Recovery Audit Integrity Test could not be loaded." +
                    "</p>";

                return;
            }

            const result =
                window
                    .PacificEducationCentralBridgeRecoveryAuditIntegrityTest
                    .run();

            let html = "";

            html +=
                "<h2>Recovery Audit &amp; Integrity Test</h2>";

            html +=
                "<p><strong>Version:</strong> " +
                result.version +
                "</p>";

            html +=
                "<p><strong>Status:</strong> " +
                result.status +
                "</p>";

            html +=
                "<p><strong>Total:</strong> " +
                result.total +
                "</p>";

            html +=
                "<p><strong>Passed:</strong> " +
                result.passed +
                "</p>";

            html +=
                "<p><strong>Failed:</strong> " +
                result.failed +
                "</p>";

            html += "<h3>Test Results</h3>";
            html += "<ol>";

            if (Array.isArray(result.tests)) {
                result.tests.forEach(function (test) {

                    html += "<li>";

                    html += test.passed
                        ? "<strong>PASS</strong>"
                        : "<strong>FAIL</strong>";

                    html +=
                        " — " +
                        test.name;

                    if (test.details) {
                        html +=
                            " — " +
                            test.details;
                    }

                    html += "</li>";
                });
            }

            html += "</ol>";

            html +=
                "<h3>Recovery Information</h3>";

            html +=
                "<pre>" +
                JSON.stringify(
                    {
                        failureId:
                            result.failureId || null,

                        productionAuthorization:
                            result.productionAuthorization === true,

                        auditBefore:
                            Array.isArray(result.auditBefore)
                                ? result.auditBefore
                                : [],

                        auditAfter:
                            Array.isArray(result.auditAfter)
                                ? result.auditAfter
                                : [],

                        communicationAuditRecords:
                            Array.isArray(
                                result.communicationAuditRecords
                            )
                                ? result.communicationAuditRecords
                                : []
                    },
                    null,
                    2
                ) +
                "</pre>";

            output.innerHTML = html;
        })();
    </script>
</body>
</html>
