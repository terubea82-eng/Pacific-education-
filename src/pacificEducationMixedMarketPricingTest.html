<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education Mixed Market Pricing Test</title>
</head>

<body>

    <h1>
        Pacific Education — Mixed Market Pricing Test
    </h1>

    <p>
        TEST ONLY — This page does not create production prices
        or process payments.
    </p>

    <pre id="result">
Running Fiji + India mixed-market pricing test...
    </pre>

    <!-- Country Registration Bridge -->
    <script src="js/pacificEducationCountryRegistrationBridge.js"></script>

    <!-- GDP Pricing Engine -->
    <script src="js/pacificEducationAnnualGdpPricingEngine.js"></script>

    <!-- Mixed Market Pricing Test -->
    <script src="js/pacificEducationMixedMarketPricingTest.js"></script>

    <script>
        (function () {
            "use strict";

            const output =
                document.getElementById("result");

            const testResult =
                window.PacificEducationMixedMarketPricingTestResult;

            if (!testResult) {
                output.textContent =
                    "TEST FAILED: Mixed-market pricing result unavailable.";
                return;
            }

            output.textContent =
                JSON.stringify(
                    testResult,
                    null,
                    2
                );
        })();
    </script>

</body>
</html>
