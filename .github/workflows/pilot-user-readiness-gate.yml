name: Pacific Education Pilot User Readiness Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate pilot release boundaries and user-readiness requirements
        run: |
          node <<'NODE'
          const fs=require('fs');
          const fail=[];
          const read=p=>fs.readFileSync(p,'utf8');
          const index=read('src/index.html');
          const entry=read('src/js/pacificEducationSinglePilotEntry.js');
          const engine=read('src/js/pacificEducationDailyCurriculumEngine.js');
          const coordinator=read('src/js/pacificEducationTeacherDailyActivityCoordinator.js');
          const voice=read('src/js/pacificEducationGlobalEducationVoice.js');
          const androidVoice=read('android/app/src/main/java/fj/pacificeducation/app/MainActivity.java');
          const lessonVoice=read('src/js/pacificEducationCurriculumLessonRenderer.js');
          const aiConversationVoice=read('js/pacificEducationAIConversation.js');
          const loader=read('src/js/pacificEducationCurrentAffairsLoader.js');
          const firebase=read('src/js/pacificEducationFirebase.js');
          const news=read('.github/workflows/daily-current-affairs.yml');

          function need(name,ok){if(!ok)fail.push(name);}

          need('global voice script linked',index.includes('pacificEducationGlobalEducationVoice.js'));
          need('current affairs loader linked',index.includes('pacificEducationCurrentAffairsLoader.js'));
          need('single registration entry',fs.existsSync('src/js/pacificEducationSinglePilotEntry.js') && index.includes('SinglePilotEntry.js'));
          need('role routing includes Student',entry.includes('student:'));
          need('role routing includes Teacher',entry.includes('teacher:'));
          need('role routing includes Parent/Caregiver',entry.includes('parent:'));
          need('role routing includes Professional Reviewer',entry.includes('professional:'));
          need('role routing includes NGO/Organization',entry.includes('ngo:'));
          need('role routing includes Education/Government',entry.includes('education:'));
          need('role routing includes Community/Partner',entry.includes('community:'));
          need('role routing includes Owner/Control',entry.includes('owner:'));
          need('role routing includes Head of School',entry.includes('"head-of-school":'));
          need('role routing includes Institution Administrator',entry.includes('"institution-admin":'));
          need('registration country control exists',entry.includes('singlePilotCountry') && entry.includes('Country — required'));
          need('registration language control exists',entry.includes('singlePilotLanguage'));
          need('student/teacher daily activities are workspace routed',entry.includes('dailyLesson') && entry.includes('assessments'));
          need('offline runtime linked',index.includes('pacificEducationConnectivity.js'));
          need('accessibility runtime linked',index.includes('pacificEducationAccessibilityRuntime.js'));
          need('pilot integrity guard linked',index.includes('pacificEducationPilotIntegrityGuard.js'));
          need('mandatory voice navigation linked',index.includes('pacificEducationMandatoryVoiceNavigation.js'));
          need('country is required',entry.includes('Country is required') && entry.includes('singlePilotCountry'));
          need('student registration safely handles an unverified session-only class level',entry.includes('Student registration must not be blocked by a missing Class Reference') && entry.includes('session-only demonstration level') && entry.includes('unverified'));
          need('teacher class reference is never created automatically',entry.includes('existing Class Reference') && entry.includes('it must not create one'));
          need('365-day coverage generator',engine.includes('for(var d=1;d<=365;d++)'));
          need('text and audio response modes',engine.includes('[\"text\",\"audio\"]'));
          need('teacher school/region coordination',coordinator.includes('school') && coordinator.includes('region') && coordinator.includes('applicableClasses'));
          need('global accessibility topics',voice.includes('war') && voice.includes('displacement') && voice.includes('disability') && voice.includes('poverty') && voice.includes('offline-first'));
          need('mandatory single narrator voice',voice.includes('speaker:\"narrator\"') && !voice.includes('speaker:\"1\"') && !voice.includes('speaker:\"2\"'));
          need('native Android uses one selected voice',!androidVoice.includes('alternateVoice') && !androidVoice.includes('secondEnglishVoice') && androidVoice.includes('Ignore legacy speaker metadata'));
          need('curriculum speech uses shared Pacedu voice',!lessonVoice.includes('new SpeechSynthesisUtterance') && lessonVoice.includes('window.speakText'));
          need('AI conversation speech uses shared Pacedu voice',!aiConversationVoice.includes('new global.SpeechSynthesisUtterance') && aiConversationVoice.includes('global.speakText'));
          need('Australia English preference',voice.includes('en[-_]AU'));
          need('five-second welcome',voice.includes('5000'));
          need('current affairs feed points to deployed docs data',loader.includes('../docs/data/current-affairs.json'));
          need('current affairs remains pending teacher review',loader.includes('copy.approved=false') && /approved:\s*false/.test(news));
          need('current affairs source restricted',news.includes('unesco.org') && news.includes('unicef.org') && news.includes('un.org') && news.includes('who.int'));
          need('production Firebase remains locked',firebase.includes('productionIntegrationEnabled: false') && firebase.includes('PRODUCTION_BACKEND_NOT_ACTIVATED'));
          need('Buy Plans protected',index.includes('buyPlans') && index.includes('data-pe-protected'));
          need('payment entitlement protected',index.includes('pacificEducationAccessEntitlement'));

          if(fail.length){console.error('READINESS GATE: FAIL');fail.forEach(x=>console.error(' - '+x));process.exit(1);}
          console.log('READINESS GATE: PASS — static pilot safety and integration requirements are present.');
          NODE

      - name: Validate JavaScript syntax
        run: |
          node --check src/js/pacificEducationSinglePilotEntry.js
          node --check src/js/pacificEducationDailyCurriculumEngine.js
          node --check src/js/pacificEducationTeacherDailyActivityCoordinator.js
          node --check src/js/pacificEducationCurrentAffairsLoader.js
          node --check src/js/pacificEducationGlobalEducationVoice.js
          node --check src/js/pacificEducationFirebase.js

      - name: Validate current-affairs JSON
        run: |
          node -e "const x=require('./docs/data/current-affairs.json'); if(!Array.isArray(x.items)) process.exit(1); console.log('Current affairs JSON: valid');"

      - name: Explicit production block
        run: |
          test "$(grep -c 'PRODUCTION_BACKEND_NOT_ACTIVATED' src/js/pacificEducationFirebase.js)" -ge 1
          echo "Production backend remains intentionally blocked pending external verification and Owner authorization."
