name: Pacedu Feature Admission Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacedu-feature-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  regression-and-preservation:
    name: Pacedu regression suite and protected baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history for baseline comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Pacedu regression suite
        run: npm test
      - name: Run desktop and mobile-viewport browser regressions
        env:
          PACEDU_TEST_URL: http://127.0.0.1:4173/src/index.html
          PACEDU_DEVICE_TEST_URL: http://127.0.0.1:4173/src/device-test.html
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/pacedu-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/src/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/src/index.html >/dev/null || { cat "$RUNNER_TEMP/pacedu-http.log"; exit 1; }
          npx playwright test tests/pacedu-device-browser.test.cjs tests/pacedu-breathing-focus-guide.test.cjs tests/pacedu-registration-scroll.test.cjs --reporter=line
      - name: Block routine edits to protected #856 voice baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '^src/js/pacificEducation(MandatoryVoiceNavigation|SpeechVoice)\.js$'; then
            echo "::error::Protected #856 voice files changed. Split this into a separately owner-reviewed baseline-change PR with explicit device-audio verification."
            exit 1
          fi
          echo "PASS: routine PR leaves protected #856 voice files unchanged."
      - name: Verify pilot safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f SECURITY.md
          test -f docs/PACEDU_FEATURE_ADMISSION_STANDARD.md
          grep -q 'productionApproved:false' src/js/pacificEducationProductionFinalGate.js
          grep -q 'productionEligible:false' src/js/pacificEducationProductionFinalGate.js
          echo "PASS: security policy and fail-closed production gates remain present."

  android-debug-build:
    name: Android debug APK compile (not a release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Compile debug APK for testing only
        working-directory: android
        run: gradle --no-daemon clean assembleDebug
      - name: Verify test APK exists and record checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/pacedu-debug-apk.sha256"
      - name: Upload debug APK as test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: pacedu-debug-apk-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
