name: PacEdu Android WebView Persistence Resilience

on:
  push:
    branches:
      - backend/trusted-sync-staging-20261110
    paths:
      - "android/**"
      - ".github/workflows/pacedu-android-webview-resilience.yml"

permissions:
  contents: read

concurrency:
  group: pacedu-android-webview-resilience
  cancel-in-progress: false

jobs:
  android-webview-process-restart:
    name: Real Android WebView IndexedDB process-restart test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          ref: backend/trusted-sync-staging-20261110

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Initialize and verify ADB server before emulator launch
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          ADB="$SDK_ROOT/platform-tools/adb"
          test -x "$ADB"
          echo "PHASE=ADB_SERVER_START"
          "$ADB" version
          "$ADB" start-server
          echo "PHASE=ADB_SERVER_READINESS_CHECK"
          timeout --signal=TERM --kill-after=5s 30s bash -Eeuo pipefail -c '
            ADB_BIN="'"\"$ADB"\"'"
            until "$ADB_BIN" devices -l >/tmp/pacedu-adb-devices.txt 2>/tmp/pacedu-adb-error.txt; do
              cat /tmp/pacedu-adb-error.txt || true
              sleep 2
            done
            cat /tmp/pacedu-adb-devices.txt
          '
          "$ADB" devices -l
          echo "PHASE=ADB_SERVER_READY"

      - name: Enable KVM access for hosted Linux runner
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "KVM_DEVICE_ACCESS=READY"

      - name: Run writer, stop app process, and verify recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hardware-acceleration: false
          emulator-boot-timeout: 600
          script: |
            bash -euo pipefail -c '
              set -Eeuo pipefail
              echo WEBVIEW_WRITE_GATE=REQUIRED
              echo PHASE=EMULATOR_DEVICE_READY_WAIT
              timeout 120s adb wait-for-device
              timeout 180s bash -c "until [ \"\$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d \"\\r\")\" = \"1\" ]; do sleep 2; done"
              echo PHASE=EMULATOR_BOOT_CONFIRMED
              adb shell settings put global package_verifier_enable 0
              adb shell settings put global verifier_verify_adb_installs 0

              echo PHASE=INDEXEDDB_WRITE_TEST_START
              timeout --signal=TERM --kill-after=30s 15m gradle -p android --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=fj.pacificeducation.app.PaceduAndroidWebViewPersistenceTest#writeRecordBeforeProcessRestart
              echo PHASE=INDEXEDDB_WRITE_TEST_PASSED
              echo WEBVIEW_WRITE_GATE=PASSED_WRITE_OK

              echo PHASE=PACEDU_APP_FORCE_STOP_START
              adb shell am force-stop fj.pacificeducation.app
              stopped=false
              for attempt in {1..15}; do
                if ! adb shell pidof fj.pacificeducation.app >/dev/null 2>&1; then
                  stopped=true
                  break
                fi
                sleep 1
              done
              if [[ "$stopped" != true ]]; then
                echo "::error::PacEdu app process did not stop after force-stop."
                exit 1
              fi
              echo PHASE=PACEDU_APP_PROCESS_STOPPED

              echo PHASE=INDEXEDDB_READ_TEST_START
              timeout --signal=TERM --kill-after=30s 15m gradle -p android --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=fj.pacificeducation.app.PaceduAndroidWebViewPersistenceTest#readRecordAfterProcessRestart
              echo PHASE=INDEXEDDB_READ_TEST_PASSED
              echo WEBVIEW_RECOVERY_GATE=PASSED_READ_OK
            '

      - name: Preserve Android instrumentation reports and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacedu-android-webview-recovery-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/outputs/androidTest-results/connected/debug/**/*.xml
            android/app/build/reports/androidTests/connected/debug/**
            android/app/build/outputs/logs/**
