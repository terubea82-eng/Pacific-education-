name: Pacific Education Pilot Recheck

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "js/**"
      - "docs/**"
      - "PILOT_100_USER_APK_DISTRIBUTION.md"
      - "PILOT_READY_CHECKLIST.md"
      - "404.html"
      - "release/production-authorization.json"
      - "automation/**"
      - ".github/workflows/pilot-recheck.yml"
      - ".github/workflows/deploy-pilot-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacific-education-pilot-recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required pilot files
        run: |
          set -e
          test -f src/index.html
          test -f src/js/pacificEducationPilotUserWorkspaces.js
          test -f src/js/pacificEducationForm1To7ScienceHealth.js
          test -f src/js/pacificEducationSubjectSelector.js
          test -f js/pacificEducationExternalReviewerPortal.js
          test -f src/js/pacificEducationLearnerActivityRuntime.js
          test -f js/pacificEducationProductionAppShell.js
          test -f PILOT_100_USER_APK_DISTRIBUTION.md
          test -f PILOT_READY_CHECKLIST.md
          test -f release/production-authorization.json

      - name: Verify all pilot roles are wired
        run: |
          set -e
          roles="student teacher special-education parent professional ngo education community owner"
          for role in $roles; do
            grep -Fq "id:\"$role\"" src/js/pacificEducationPilotUserWorkspaces.js
          done
          grep -Fq 'pacificEducationPilotUserWorkspaces.js' src/index.html

      - name: Verify Form 1-7 Science and Health pilot coverage
        run: |
          set -e
          for subject in "Health Science" "Basic Science" "Elementary Science" "Biology" "Chemistry" "Physics"; do
            grep -Fq "id:\"$subject\"" src/js/pacificEducationForm1To7ScienceHealth.js
            grep -Fq "id: \"$subject\"" src/js/pacificEducationSubjectSelector.js
          done
          grep -Fq 'Form 1' src/js/pacificEducationForm1To7ScienceHealth.js
          grep -Fq 'Form 7' src/js/pacificEducationForm1To7ScienceHealth.js
          grep -Fq 'curriculumVerification:"required-before-production"' src/js/pacificEducationForm1To7ScienceHealth.js
          grep -Fq 'verified:false' src/js/pacificEducationForm1To7ScienceHealth.js

      - name: Verify daily activity runtime
        run: |
          set -e
          grep -Fq "window.PacificEducationActivity =" src/js/pacificEducationLearnerActivityRuntime.js
          grep -Fq "multiple_choice" src/js/pacificEducationLearnerActivityRuntime.js
          grep -Fq "true_false" src/js/pacificEducationLearnerActivityRuntime.js
          grep -Fq "matching" src/js/pacificEducationLearnerActivityRuntime.js
          grep -Fq "short_answer" src/js/pacificEducationLearnerActivityRuntime.js
          grep -Fq "long_answer" src/js/pacificEducationLearnerActivityRuntime.js
          grep -Fq "pacificEducationLearnerActivityRuntime.js" src/index.html
          grep -Fq "pacificEducationLearnerActivityRuntime.js" src/index.html

      - name: Verify Professional Reviewer portal wiring
        run: |
          set -e
          grep -Fq 'pacificEducationExternalReviewerPortal.js' src/index.html || grep -Fq 'pacificEducationExternalReviewerPortal.js' js/pacificEducationProductionAppShell.js
          grep -Fq 'script.src = "../js/pacificEducationExternalReviewerPortal.js"' js/pacificEducationProductionAppShell.js
          grep -Fq 'window.PacificEducationExternalReviewerPortal' js/pacificEducationExternalReviewerPortal.js
          grep -Fq 'function render()' js/pacificEducationExternalReviewerPortal.js
          grep -Fq 'External Professional Review Portal' js/pacificEducationExternalReviewerPortal.js

      - name: Verify production remains fail-closed
        run: |
          set -e
          grep -q '"productionApproved": false' release/production-authorization.json
          grep -q '"productionEligible": false' release/production-authorization.json
          grep -q '"release_status": "BLOCKED"' release/production-authorization.json

      - name: Verify pilot boundary does not require production authorization
        run: |
          set -e
          grep -Fq 'pilotOnly' src/js/pacificEducationPacificGuardian.js
          grep -Fq 'productionAuthority:false' src/js/pacificEducationPacificGuardian.js
          grep -Fq 'productionApproval:false' src/js/pacificEducationPacificGuardian.js

      - name: Verify live pilot links
        timeout-minutes: 5
        run: |
          set -e
          root_ok=false
          src_ok=false
          for attempt in $(seq 1 12); do
            root_code=$(curl -sSL --connect-timeout 10 --max-time 30 -o /tmp/pacific-root.html -w "%{http_code}" "https://terubea82-eng.github.io/Pacific-education-/?pilot_recheck=$GITHUB_RUN_ID" || true)
            src_code=$(curl -sSL --connect-timeout 10 --max-time 30 -o /tmp/pacific-src.html -w "%{http_code}" "https://terubea82-eng.github.io/Pacific-education-/src/index.html?pilot_recheck=$GITHUB_RUN_ID" || true)
            echo "Attempt $attempt: root=$root_code src=$src_code"
            echo "Portal asset: https://terubea82-eng.github.io/Pacific-education-/js/pacificEducationExternalReviewerPortal.js"
            portal_code=$(curl -sSL --connect-timeout 10 --max-time 30 -o /tmp/pacific-reviewer.js -w "%{http_code}" "https://terubea82-eng.github.io/Pacific-education-/js/pacificEducationExternalReviewerPortal.js?pilot_recheck=$GITHUB_RUN_ID" || true)
            echo "Attempt $attempt: reviewer_portal_js=$portal_code"
            if [ "$root_code" = "200" ] && [ "$src_code" = "200" ] && [ "$portal_code" = "200" ] && grep -qi "Pacific Education" /tmp/pacific-root.html && grep -qi "Pilot User Workspaces" /tmp/pacific-src.html && grep -qi "External Professional Review Portal" /tmp/pacific-reviewer.js; then
              root_ok=true
              src_ok=true
              break
            fi
            sleep 15
          done
          if [ "$root_ok" != "true" ] || [ "$src_ok" != "true" ]; then
            echo "::error::GitHub Pages pilot content or Professional Reviewer portal asset was not verified within the retry window."
            exit 1
          fi
          echo "GitHub Pages root HTTP status: $root_code"
          echo "GitHub Pages /src/index.html HTTP status: $src_code"
          echo "Professional Reviewer portal asset HTTP status: $portal_code"

      - name: Publish recheck summary
        run: |
          {
            echo "## Pacific Education pilot recheck"
            echo "- Required pilot files: PASS"
            echo "- All pilot roles wired: PASS"
            echo "- Form 1-7 Science and Health pilot coverage: PASS"
            echo "- Professional Reviewer portal wiring: PASS"
            echo "- Production gate remains BLOCKED: PASS"
            echo "- Pilot boundary remains separate from production authorization: PASS"
            echo "- GitHub Pages deployment and reviewer portal asset: verified by live HTTP checks"
            echo ""
            echo "Pilot URL: https://terubea82-eng.github.io/Pacific-education-/"
          } >> "$GITHUB_STEP_SUMMARY"
