name: Pacific Education Prototype Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './src/js/src/js/pacificEducationCountryGdpPricingBrokenLineTest.js' | sort)
          test "${#files[@]}" -gt 0
          failed=0
          for file in "${files[@]}"; do
            if ! node --check "$file"; then
              echo "::error file=$file::JavaScript syntax validation failed"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Validate local script references across repository HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path(".").resolve()
          excluded_html = {
              root / "src/pacificEducationCountryGdpPricingBrokenLineTest.html",
              root / "src/src/pacificEducationCountryGdpPricingBrokenLineTest.html",
              root / "src/pacificEducationCentralBridgeTestRunner.html",
              root / "src/pacificEducationCentralBridgeFailureRecoveryTest.html",
              root / "src/pacificEducationCentralBridgeIntegrationTestRunner.html",
              root / "src/pacificEducationCentralBridgeFailureRecoveryTestRunner.html",
          }
          excluded_name_patterns = (
              "Test.html",
              "TestRunner.html",
              "BrokenLineTest.html",
              "TestPage.html",
          )
          missing = []
          checked_files = 0
          checked_refs = 0

          for html in sorted(root.rglob("*.html")):
              if ".git" in html.parts or html in excluded_html or html.name.endswith(excluded_name_patterns):
                  continue
              checked_files += 1
              text = html.read_text(encoding="utf-8", errors="strict")
              refs = re.findall(r'<script\b[^>]+src=["\']([^"\']+)["\']', text, flags=re.IGNORECASE)
              for ref in refs:
                  if "://" in ref or ref.startswith("//") or ref.startswith("data:"):
                      continue
                  checked_refs += 1
                  clean_ref = ref.split("?", 1)[0].split("#", 1)[0]
                  target = (html.parent / clean_ref).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      missing.append((html.relative_to(root), ref, target))
                      continue
                  if not target.is_file():
                      missing.append((html.relative_to(root), ref, target.relative_to(root)))

          if missing:
              print("Missing or invalid local script references:")
              for html, ref, target in missing:
                  print(f"- {html}: {ref} -> {target}")
              sys.exit(1)

          print(f"Validated {checked_refs} local script references across {checked_files} HTML files.")
          print("Intentionally broken fixture pages are excluded from this path check.")
          PY

      - name: Validate required publication records
        shell: bash
        run: |
          set -euo pipefail
          test -f PUBLICATION_READINESS.md
          test -f src/index.html
          test -f src/service-worker.js
          echo "Required publication records and prototype entry files exist."

      - name: Validate fail-closed production markers
        shell: bash
        run: |
          set -euo pipefail
          grep -R "productionApproved.*false\|productionApproved: false" src/js >/dev/null
          grep -R "productionEligible.*false\|productionEligible: false" src/js >/dev/null
          echo "Fail-closed production markers detected."

      - name: Validate prototype security boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f js/pacificEducationSecureLinkAuthorization.js
          test -f js/pacificEducationSecureCommunication.js
          grep -q 'user.prototypeSession === true' js/pacificEducationSecureLinkAuthorization.js
          grep -q 'user.prototypeSession === true' js/pacificEducationSecureCommunication.js
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          pattern=re.compile(r'''src\s*=\s*["'][^"']*(?:https?:)?//|fetch\(\s*["']https?://|XMLHttpRequest''',re.I)
          findings=[]
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts or p.suffix.lower() not in {".html",".js"}: continue
              for n,line in enumerate(p.read_text(encoding="utf-8",errors="ignore").splitlines(),1):
                  if pattern.search(line): findings.append(f"{p}:{n}: {line.strip()}")
          if findings:
              print("\n".join(findings)); sys.exit(1)
          print("Prototype runtime external-network scan passed.")
          PY

      - name: Scan repository for obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|AIza[0-9A-Za-z_-]{20,}|password[[:space:]]*=[[:space:]]*["'"][^"'"]+["'"])' .; then
            echo "::error::Potential secret or credential pattern found"
            exit 1
          fi
          echo "No obvious committed secret patterns found."

      - name: Validate Pacific Guardian production gate
        shell: bash
        run: |
          set -euo pipefail
          test -f src/js/pacificEducationGuardianReviewController.js
          grep -q 'requiredForProduction: true' src/js/pacificEducationGuardianReviewController.js
          grep -q 'SERVER_GUARDIAN_VERIFICATION_REQUIRED' src/js/pacificEducationGuardianReviewController.js
          grep -q 'guardianReviewRequired: true' src/js/pacificEducationMasterControl.js
          grep -q 'guardianReady' src/js/pacificEducationMasterControl.js
          grep -q 'serverAuthorized' src/js/pacificEducationMasterControl.js
          echo "Pacific Guardian mandatory production gate markers validated."

      - name: Validate Pacific Guardian stage automation
        shell: bash
        run: |
          set -euo pipefail
          test -f automation/stage-completion.json
          test -f automation/stage-allowlist.json
          test -f automation/stage-evidence-requirements.json
          test -f automation/STAGE_20_EVIDENCE_MAPPING.md
          test -f automation/pacificGuardianStageWriteCheck.js
          test -f .github/workflows/pacific-guardian-stage-write.yml
          node --check automation/pacificGuardianStageWriteCheck.js
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("automation/stage-allowlist.json","utf8")); const r=JSON.parse(fs.readFileSync("automation/stage-evidence-requirements.json","utf8")); for (let n=20;n<=30;n++) { const s=x.stages[String(n)], e=r.stages[String(n)]; if (!s) throw new Error("missing stage "+n); if (!e) throw new Error("missing evidence contract "+n); if (!["B","C"].includes(s.changeClass)) throw new Error("unsafe class for stage "+n); if (s.autoWrite !== false) throw new Error("stage "+n+" must remain review-controlled"); if (typeof s.implementationSpec !== "string" || !s.implementationSpec.trim()) throw new Error("missing implementation spec for stage "+n); if (!fs.existsSync(s.implementationSpec)) throw new Error("missing implementation spec file for stage "+n); if (!Array.isArray(s.allowlistedTargets) || !s.allowlistedTargets.includes(s.implementationSpec)) throw new Error("implementation spec not allowlisted for stage "+n); if (!Array.isArray(e.requiredEvidence) || !e.requiredEvidence.length) throw new Error("missing required evidence for stage "+n); if (typeof e.completionAuthority !== "string" || !e.completionAuthority.trim()) throw new Error("missing completion authority for stage "+n); if (n<30 && s.nextStage !== n+1) throw new Error("broken next-stage link for stage "+n); if (n===30 && s.nextStage !== null) throw new Error("Stage 30 must terminate the chain"); }'
          node automation/pacificGuardianStageWriteCheck.js automation/stage-completion.json automation/stage-allowlist.json automation/stage-evidence-requirements.json automation/STAGE_20_EVIDENCE_MAPPING.md automation/extension-need-assessment.json | grep -q '"eligible":false'
          node -e 'const fs=require("fs"); const m=fs.readFileSync("automation/STAGE_20_EVIDENCE_MAPPING.md","utf8"); const r=JSON.parse(fs.readFileSync("automation/stage-evidence-requirements.json","utf8")); for (const x of r.stages["20"].requiredEvidence) if (!m.includes(x)) throw new Error("Stage 20 evidence mapping missing: "+x);'
          echo "Pacific Guardian Stage 20-30 automation and evidence verification are configured fail-closed."

      - name: Validate need-based optional extension policy
        run: |
          set -euo pipefail
          test -f automation/extension-need-assessment.json
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("automation/stage-allowlist.json","utf8")); const p=a.extensionPolicy; const n=JSON.parse(fs.readFileSync("automation/extension-need-assessment.json","utf8")); if(!p || p.requiredAfterStage30!==false || p.defaultDecision!=="NO_EXTENSION_REQUIRED" || p.noAutomaticTimeBasedExtension!==true || p.activateOnlyRelevantStages!==true) throw new Error("Invalid extension policy"); if(n.defaultDecision!=="NO_EXTENSION_REQUIRED" || !n.prohibitedTrigger.includes("Time elapsed alone")) throw new Error("Invalid need-assessment policy"); for(let i=31;i<=36;i++){const s=a.stages[String(i)], e=(JSON.parse(fs.readFileSync("automation/stage-evidence-requirements.json","utf8"))).stages[String(i)]; if(!s) throw new Error("missing extension stage "+i); if(!e) throw new Error("missing extension evidence contract "+i); if(s.autoWrite!==false) throw new Error("extension stage "+i+" must remain review-controlled"); if(s.nextStage!==null) throw new Error("extension stage "+i+" must not auto-chain"); if(typeof s.implementationSpec!=="string" || !s.implementationSpec.trim()) throw new Error("missing extension implementation spec "+i); if(!fs.existsSync(s.implementationSpec)) throw new Error("missing extension implementation file "+i); if(!Array.isArray(s.allowlistedTargets) || !s.allowlistedTargets.includes(s.implementationSpec)) throw new Error("extension spec not allowlisted "+i); if(!Array.isArray(e.requiredEvidence) || !e.requiredEvidence.length) throw new Error("missing extension evidence "+i); if(typeof e.completionAuthority!=="string" || !e.completionAuthority.trim()) throw new Error("missing extension completion authority "+i);} if(a.stages["30"].nextStage!==null) throw new Error("Stage 30 must not auto-chain to an extension"); console.log("Stages 31-36 optional, independent, need-based extension policy: PASS");'
      - name: Test extension activation remains need-based and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          node - "$tmp" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const out = process.argv[2];
          const allow = JSON.parse(fs.readFileSync("automation/stage-allowlist.json", "utf8"));
          const req = JSON.parse(fs.readFileSync("automation/stage-evidence-requirements.json", "utf8"));
          const stage = 31;
          const s = allow.stages[String(stage)];
          const e = req.stages[String(stage)];
          const evidence = {
            version: "test",
            stage,
            status: "COMPLETE",
            testsPassed: true,
            evidence: e.requiredEvidence.map((requirement) => ({ requirement, status: "VERIFIED", verifiedBy: "automated-extension-gate-test", verifiedAt: "2026-01-01T00:00:00Z" })),
            evidenceType: s.requiredEvidenceType,
            completionAuthority: e.completionAuthority,
            reviewStatus: "APPROVED",
            reviewType: s.reviewRequired,
            blockingDefects: 0,
            targetFiles: [s.implementationSpec],
            changeClass: s.changeClass
          };
          fs.writeFileSync(path.join(out, "stage31-evidence.json"), JSON.stringify(evidence, null, 2));
          NODE
          cp automation/extension-need-assessment.json "$tmp/no-extension.json"
          no_extension_result="$(node automation/pacificGuardianStageWriteCheck.js "$tmp/stage31-evidence.json" automation/stage-allowlist.json automation/stage-evidence-requirements.json automation/STAGE_20_EVIDENCE_MAPPING.md "$tmp/no-extension.json")"
          echo "$no_extension_result"
          echo "$no_extension_result" | grep -q '"eligible":false'
          echo "$no_extension_result" | grep -q 'extension_not_activated_by_need_assessment'
          node - "$tmp" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const out = process.argv[2];
          const n = JSON.parse(fs.readFileSync("automation/extension-need-assessment.json", "utf8"));
          n.decision = "EXTENSION_REQUIRED";
          n.assessedAt = "2026-01-01T00:00:00Z";
          n.assessedBy = "automated-extension-gate-test";
          n.reason = "Automated test of explicit need-based activation";
          n.evidence = ["automated-test-evidence"];
          n.affectedCapability = "continuous-security-monitoring";
          n.relevantExtensionStages = [31];
          n.reviewStatus = "APPROVED";
          n.ownerDecision = "APPROVED";
          fs.writeFileSync(path.join(out, "extension-required.json"), JSON.stringify(n, null, 2));
          NODE
          required_result="$(node automation/pacificGuardianStageWriteCheck.js "$tmp/stage31-evidence.json" automation/stage-allowlist.json automation/stage-evidence-requirements.json automation/STAGE_20_EVIDENCE_MAPPING.md "$tmp/extension-required.json")"
          echo "$required_result"
          echo "$required_result" | grep -q '"eligible":true'
          echo "$required_result" | grep -q '"stage":31'
          echo "$required_result" | grep -q '"nextStage":null'
          echo "Need-based extension activation test passed: no need blocks Stage 31; explicit verified need permits evaluation."

