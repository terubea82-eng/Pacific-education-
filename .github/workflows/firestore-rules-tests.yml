name: Pacedu Firebase Security Rules Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tests/firestore-rules.test.cjs"
      - ".github/workflows/firestore-rules-tests.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tests/firestore-rules.test.cjs"
      - ".github/workflows/firestore-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacedu-firebase-security-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firebase-rules:
    name: Firestore and Storage authorization regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked project dependencies
        run: npm ci

      - name: Install Firebase rules test tools without changing project manifests
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing

      - name: Test Firestore and Storage rules in local emulators
        run: npx firebase-tools emulators:exec --only firestore,storage --project demo-pacedu-firestore-rules "node --test tests/firestore-rules.test.cjs"

      - name: Confirm Firebase project configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=require('./firebase.json'); if(c.firestore.location !== 'asia-southeast1' || c.firestore.rules !== 'firestore.rules' || c.storage.rules !== 'storage.rules') process.exit(1)"
          echo "PASS: Firestore region is unchanged and both security rule files are registered."
