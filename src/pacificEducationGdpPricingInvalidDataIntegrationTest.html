<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education GDP Pricing Invalid Data Integration Test</title>
</head>

<body>
    <h1>Pacific Education — GDP Pricing → Invalid Data → Audit Integration Test</h1>

    <p>
        TEST ONLY — This page does not create production prices
        or process payments.
    </p>

    <pre id="result">
Running invalid GDP data integration test...
    </pre>

    <script src="js/pacificEducationAnnualGdpPricingEngine.js"></script>
    <script src="js/pacificEducationPricingAuditGuard.js"></script>
    <script src="js/pacificEducationGdpPricingInvalidDataIntegrationTest.js?v=1.0.1"></script>

    <script>
        (function () {
            "use strict";

            const output =
                document.getElementById("result");

            const testResult =
                window.PacificEducationGdpPricingInvalidDataIntegrationTestResult;

            if (!testResult) {
                output.textContent =
                    "TEST FAILED: Invalid GDP data integration result unavailable.";
                return;
            }

            output.textContent =
                JSON.stringify(
                    testResult,
                    null,
                    2
                );
        })();
    </script>
</body>
</html>
