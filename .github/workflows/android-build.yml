name: Pacific Education Android Build
on:
  workflow_dispatch:
  push:
    paths: ["android/**",".github/workflows/android-build.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.6.0"}
      - name: Build unsigned validation bundle
        run: gradle --no-daemon :app:bundleRelease
        working-directory: android
      - name: Verify validation artifact
        run: test -s android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-unsigned-validation-v1.0.2
          path: android/app/build/outputs/bundle/release/app-release.aab
