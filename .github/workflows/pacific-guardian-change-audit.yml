name: Pacific Guardian Mandatory App Change Audit

on:
  push:
    paths:
      - "src/**"
      - "js/**"
      - "owner/**"
      - "android/**"
      - "app/**"
      - "automation/**"
      - ".github/workflows/**"
      - "STAGE_*"
      - "PRODUCTION_*"
      - "PACIFIC_EDUCATION_MASTER*"
      - "PACIFIC_GUARDIAN*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Record every app or architecture change
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node automation/pacificGuardianChangeAudit.js
      - name: Commit mandatory audit record
        run: |
          set -euo pipefail
          if git diff --quiet -- automation/change-audit/; then
            echo "No new audit record required."
            exit 0
          fi
          git config user.name "Pacific Guardian Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/change-audit/
          git commit -m "Pacific Guardian: record app architecture change audit"
          git push
