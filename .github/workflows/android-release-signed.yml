name: Pacific Education Signed Android Release
on:
  workflow_dispatch:
jobs:
  signed-release:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.6.0"}
      - name: Report missing signing configuration
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '' }}
        run: echo "::notice::Signed AAB skipped because one or more signing secrets are not configured. Add the four required repository secrets, then run this workflow manually."
      - name: Restore keystore
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pacific-education-release.jks"
      - name: Build signed AAB
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
        run: gradle --no-daemon :app:bundleRelease
        working-directory: android
      - name: Verify signed AAB
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        run: jarsigner -verify -verbose android/app/build/outputs/bundle/release/app-release.aab
      - if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-signed-v1.0.2
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
