<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"

    <title>Pacific Education Broken-Line Test</title>
</head>

<body>

    <h1>Pacific Education Broken-Line Test</h1>

    <pre id="testResult">

    <script src="js/pacificEducationBrokenLineAuditRunner.js"></script>

    <script>
        (function () {
            "use strict";

            const report =
                window.PacificEducationBrokenLineAuditReport;

            const result =

            document.getElementById("testResult")

                        null,
                        2

        })();
    </script>
