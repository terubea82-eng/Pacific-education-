name: Pacific Education Daily Current Affairs Feed
on:
  # Run after a change to this workflow lands on main, so feed-source fixes
  # are tested immediately instead of waiting for the next scheduled run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-current-affairs.yml"
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pacedu-current-affairs-feed
  cancel-in-progress: false
jobs:
  refresh-current-affairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate official education and public-interest RSS feeds
        run: |
          set -euo pipefail
          mkdir -p docs/data
          # Use publisher feeds directly instead of GDELT, which has repeatedly
          # returned HTTP 429 or an empty {} response from shared CI runners.
          # Each source is isolated: a temporarily unavailable feed is skipped,
          # but the existing JSON is never overwritten unless eligible articles
          # are successfully collected and validated.
          declare -A feeds=(
            [unesco]="https://www.unesco.org/en/newsroom"
            [who]="https://www.who.int/rss-feeds/news-english.xml"
            [un]="https://news.un.org/feed/subscribe/en/news/topic/sdgs/feed/rss.xml"
          )
          for source in unesco who un; do
            echo "Fetching official feed: $source"
            if curl --silent --show-error --fail --location --connect-timeout 15 --max-time 45 \
              --retry 2 --retry-all-errors --retry-delay 3 \
              --user-agent 'PacificEducationPilot/1.0 (educational current-affairs feed)' \
              --header 'Accept: application/rss+xml, application/atom+xml, application/xml, text/xml, */*' \
              "${feeds[$source]}" -o "/tmp/feed-$source.xml"; then
              echo "$source feed downloaded"
            else
              echo "::warning::Could not download $source feed; trying remaining official feeds."
              rm -f "/tmp/feed-$source.xml"
            fi
          done
          node <<'NODE'
          const fs = require('fs');
          const { URL } = require('url');
          const { execFileSync } = require('child_process');
          const sources = [
            { key: 'unesco', label: 'UNESCO', host: 'unesco.org' },
            { key: 'who', label: 'WHO', host: 'who.int' },
            { key: 'un', label: 'UN News', host: 'un.org' }
          ];
          const allowedHosts = ['unesco.org', 'unicef.org', 'un.org', 'who.int'];
          function decode(s) {
            return String(s || '')
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
              .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
              .replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>').replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
              .replace(/&#x([\da-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
              .replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
          }
          function tag(block, name) {
            const re = new RegExp('<(?:[\\w.-]+:)?' + name + '\\b[^>]*>([\\s\\S]*?)<\\/(?:[\\w.-]+:)?' + name + '\\s*>', 'i');
            const m = block.match(re);
            return m ? decode(m[1]) : '';
          }
          function entries(xml) {
            const blocks = xml.match(/<(?:item|entry)\b[^>]*>[\s\S]*?<\/(?:item|entry)\s*>/gi) || [];
            if (!blocks.length && /unesco\.org\/en\/newsroom/i.test(xml.slice(0, 5000))) {
              // UNESCO's newsroom endpoint is currently HTML rather than RSS/XML.
              // Read only article links from the official newsroom and require a
              // nearby publication date; normal URL, freshness and relevance checks
              // below still apply before any item is accepted.
              const htmlItems = [];
              const anchors = [...xml.matchAll(/<a\b([^>]*?)href=["']([^"']+)["']([^>]*)>([\s\S]*?)<\/a>/gi)];
              const datePattern = /datetime=["']([^"']+)["']|\b(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})\b/gi;
              for (const m of anchors) {
                const href = m[2].replace(/&amp;/g, '&');
                if (!/^(?:https:\/\/www\.unesco\.org)?\/(?:en\/)?(?:articles|news|press-releases|statements|press-invitations)\//i.test(href)) continue;
                const title = decode(m[4]);
                if (!title || title.length < 12 || /^(read more|learn more|more)$/i.test(title)) continue;
                const start = Math.max(0, m.index - 450);
                const end = Math.min(xml.length, m.index + m[0].length + 700);
                const neighborhood = xml.slice(start, end);
                const dates = [];
                for (const dm of neighborhood.matchAll(datePattern)) {
                  const raw = dm[1] || dm[2];
                  const timestamp = Date.parse(raw);
                  if (Number.isFinite(timestamp)) dates.push({ raw, timestamp, distance: Math.abs(start + dm.index - m.index) });
                }
                dates.sort((a, b) => a.distance - b.distance);
                const articleUrl = new URL(href, 'https://www.unesco.org').toString();
                // The newsroom card may expose a modified/event date. Use only
                // the linked article's explicit original publication metadata;
                // never substitute dateModified or a nearby card timestamp.
                let articleHtml = '';
                try {
                  articleHtml = execFileSync('curl', [
                    '--silent', '--show-error', '--fail', '--location',
                    '--connect-timeout', '8', '--max-time', '15',
                    '--user-agent', 'PacificEducationPilot/1.0 (educational current-affairs feed)',
                    '--header', 'Accept: text/html',
                    articleUrl
                  ], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'], maxBuffer: 2 * 1024 * 1024 });
                } catch (_) {
                  console.warn('Skipping UNESCO item because article metadata could not be fetched: ' + articleUrl);
                  continue;
                }
                const publicationMatches = [
                  ...articleHtml.matchAll(/"datePublished"\s*:\s*"([^"]+)"/gi),
                  ...articleHtml.matchAll(/<meta\b[^>]*(?:property|name)=["'](?:article:published_time|datePublished)["'][^>]*content=["']([^"']+)["'][^>]*>/gi)
                ];
                const publicationValues = publicationMatches.map(match => match[1])
                  .filter(value => /^\d{4}-\d{2}-\d{2}/.test(value));
                const publicationTimestamp = publicationValues.length ? Date.parse(publicationValues[0]) : NaN;
                if (!Number.isFinite(publicationTimestamp)) {
                  console.warn('Skipping UNESCO item without explicit datePublished metadata: ' + articleUrl);
                  continue;
                }
                htmlItems.push({
                  title,
                  url: articleUrl,
                  date: new Date(publicationTimestamp).toISOString(),
                  description: title
                });
              }
              const unique = new Map();
              for (const item of htmlItems) if (!unique.has(item.url)) unique.set(item.url, item);
              return [...unique.values()];
            }
            return blocks.map(b => {
              let link = tag(b, 'link');
              if (!link) {
                const m = b.match(/<link\b[^>]*href=["']([^"']+)["'][^>]*\/?\s*>/i);
                if (m) link = m[1];
              }
              return {
                title: tag(b, 'title'),
                url: link,
                date: tag(b, 'pubDate') || tag(b, 'published') || tag(b, 'date'),
                description: tag(b, 'description') || tag(b, 'summary') || tag(b, 'content')
              };
            });
          }
          function approvedUrl(value) {
            try {
              const u = new URL(String(value || ''));
              return u.protocol === 'https:' && allowedHosts.some(h => u.hostname === h || u.hostname.endsWith('.' + h));
            } catch (_) { return false; }
          }
          // Some publisher feeds expose an updated timestamp in their publication
          // field. WHO article URLs encode the original publication date as
          // /news/item/DD-MM-YYYY-...; reject any feed date that contradicts it.
          function urlPublicationDate(value) {
            try {
              const u = new URL(String(value || ''));
              if (!(u.hostname === 'who.int' || u.hostname.endsWith('.who.int'))) return null;
              const m = u.pathname.match(/\/news\/item\/(\d{2})-(\d{2})-(\d{4})(?:-|\/|$)/i);
              return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
            } catch (_) { return null; }
          }
          function dateMatchesUrlPublicationDate(value, timestamp) {
            const expected = urlPublicationDate(value);
            return !expected || new Date(timestamp).toISOString().slice(0, 10) === expected;
          }
          // Regression guard: this 2020 WHO article must never be accepted with
          // the 2026 update timestamp previously emitted by the feed.
          const whoRegressionUrl = 'https://www.who.int/news/item/27-08-2020-new-who-technical-package-health-data-for-covid-19-response';
          if (dateMatchesUrlPublicationDate(whoRegressionUrl, Date.parse('2026-10-10T07:49:45.000Z')) ||
              !dateMatchesUrlPublicationDate(whoRegressionUrl, Date.parse('2020-08-27T00:00:00.000Z'))) {
            throw new Error('WHO publication-date regression test failed.');
          }
          function subjects(text) {
            const t = String(text || '').toLowerCase(), s = [];
            if (/literacy|reading|language|english|teacher|school|education|learning/.test(t)) s.push('English');
            if (/math|mathematics|number|data/.test(t)) s.push('Mathematics');
            if (/science|health|disease|climate|environment|disaster|pandemic/.test(t)) s.push('Science', 'Health Science');
            if (/technology|digital|internet|computer|artificial intelligence|\bai\b/.test(t)) s.push('Computer Studies');
            if (/community|society|government|poverty|displacement|children|child rights/.test(t)) s.push('Social Science');
            if (/place|country|climate|environment|migration/.test(t)) s.push('Geography');
            if (/history|heritage|conflict|war|culture/.test(t)) s.push('History');
            return [...new Set(s)];
          }
          const all = [];
          const diagnostics = {};
          for (const source of sources) {
            const counts = {
              parsed: 0, missingTitle: 0, rejectedUrl: 0, invalidDate: 0,
              tooOld: 0, futureDate: 0, urlDateMismatch: 0, irrelevant: 0, accepted: 0
            };
            diagnostics[source.label] = counts;
            const path = '/tmp/feed-' + source.key + '.xml';
            if (!fs.existsSync(path)) {
              console.warn(source.label + ': feed file missing');
              continue;
            }
            const xml = fs.readFileSync(path, 'utf8');
            const found = entries(xml);
            counts.parsed = found.length;
            console.log(source.label + ': parsed ' + found.length + ' feed entries');
            for (const a of found) {
              const title = String(a.title || '').trim();
              const url = String(a.url || '').trim();
              const publishedTime = Date.parse(String(a.date || ''));
              const now = Date.now();
              const cutoffTime = now - 180 * 24 * 60 * 60 * 1000;
              if (!title) { counts.missingTitle++; continue; }
              if (!approvedUrl(url)) { counts.rejectedUrl++; continue; }
              if (!Number.isFinite(publishedTime)) { counts.invalidDate++; continue; }
              // Treat this as current affairs, not an archive: exclude undated,
              // malformed, older-than-180-day, and future-dated items.
              if (publishedTime < cutoffTime) { counts.tooOld++; continue; }
              if (publishedTime > now + 24 * 60 * 60 * 1000) { counts.futureDate++; continue; }
              if (!dateMatchesUrlPublicationDate(url, publishedTime)) {
                counts.urlDateMismatch++;
                console.warn('Rejected feed date that conflicts with publisher URL date: ' + url +
                  ' (feed=' + new Date(publishedTime).toISOString() +
                  ', URL=' + urlPublicationDate(url) + ')');
                continue;
              }
              // Exclude navigation/noise while keeping education and broad public
              // interest stories useful for teacher-led current-affairs lessons.
              const relevance = (title + ' ' + a.description).toLowerCase();
              if (!/education|school|learning|teacher|child|children|health|science|climate|environment|culture|heritage|poverty|community|development|digital|technology|literacy|university|student|students|humanitarian|sustainable|gender|disaster|water|food|public health/.test(relevance)) {
                counts.irrelevant++;
                continue;
              }
              counts.accepted++;
              all.push({ ...a, url, title, source: source.label });
            }
            console.log(source.label + ' filter counts: ' + JSON.stringify(counts));
          }
          const seen = new Set();
          const items = all.filter(a => {
            if (seen.has(a.url)) return false;
            seen.add(a.url);
            return true;
          }).map((a, i) => {
            const applicable = subjects(a.title + ' ' + a.description);
            return {
              id: 'OFFICIAL-' + require('crypto').createHash('sha256').update(a.url).digest('hex').slice(0, 24),
              title: a.title,
              url: a.url,
              source: a.source,
              publishedAt: new Date(Date.parse(a.date)).toISOString(),
              topic: 'Education and current affairs',
              educationalRelevance: 'Potentially useful for teacher-led discussion of education, health, science, environment, culture, children, or sustainable development.',
              ageSuitability: 'Teacher/reviewer screening required before student use.',
              subjectsApplicable: applicable,
              levelsApplicable: [],
              verificationStatus: 'PENDING_TEACHER_REVIEW',
              approved: false,
              sourceType: 'EDUCATIONAL_CURRENT_AFFAIRS'
            };
          }).sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt)).slice(0, 30);
          if (items.length === 0) {
            throw new Error('No eligible articles were parsed from official feeds; preserving existing feed.');
          }
          const out = {
            version: '1.0.0',
            generatedAt: new Date().toISOString(),
            source: 'UNESCO newsroom links validated against article datePublished metadata, WHO RSS and UN News RSS feeds',
            items
          };
          fs.writeFileSync('docs/data/current-affairs.json', JSON.stringify(out, null, 2) + '\n');
          console.log('Validated ' + items.length + ' articles; all remain pending teacher review.');
          NODE
      - name: Commit feed when changed
        run: |
          git config user.name "pacific-education-bot"
          git config user.email "actions@github.com"
          git add docs/data/current-affairs.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh daily educational current affairs feed"
          # main may advance while the feed is being generated. Rebase the
          # feed-only commit on the latest main and retry non-fast-forward
          # pushes; never force-push or auto-resolve a content conflict.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Current-affairs feed conflicts with newer main changes; refusing to overwrite."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main advanced during feed publication (attempt ${attempt}/3); retrying."
          done
          echo "::error::Could not publish feed after three safe retries."
          exit 1
