<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education Fiji Protected Market Test</title>
</head>

<body>

    <h1>Pacific Education — Fiji Protected Market Test</h1>

    <p>
        TEST ONLY — This page does not create a production price
        or process payments.
    </p>

    <pre id="result">Running Fiji protected-market test...</pre>

    <script src="js/pacificEducationAnnualGdpPricingEngine.js"></script>

    <script src="js/pacificEducationFijiProtectedMarketTest.js"></script>

    <script>
        (function () {
            "use strict";

            const output =
                document.getElementById("result");

            const testResult =
                window.PacificEducationFijiProtectedMarketTestResult;

            if (!testResult) {
                output.textContent =
                    "TEST FAILED: Fiji protected-market result unavailable.";
                return;
            }

            output.textContent =
                JSON.stringify(
                    testResult,
                    null,
                    2
                );
        })();
    </script>

</body>
</html>
