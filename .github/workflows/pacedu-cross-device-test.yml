name: Pacedu Cross-Device Browser Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "index.html"
      - "privacy-policy.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pacedu-cross-device-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "index.html"
      - "privacy-policy.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pacedu-cross-device-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacedu-cross-device-tests-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  regression:
    name: PacEdu software regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run existing Pacedu software regression suite
        run: npm test

  browser-tests:
    name: Chromium ${{ matrix.group_name }} viewport tests
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group_name: device interactions
            tests: tests/pacedu-device-browser.test.cjs
          - group_name: entry and accessibility
            tests: tests/pacedu-root-entry-redirect.test.cjs tests/pacedu-breathing-focus-guide.test.cjs
          - group_name: registration flow
            tests: tests/pacedu-registration-scroll.test.cjs tests/pacedu-registration-workspace-visibility.test.cjs tests/student-registration-workspace-handoff.test.cjs
          - group_name: teacher workspace
            tests: tests/teacher-quick-manual-answer-entry.test.cjs tests/linked-teacher-plans-require-class.test.cjs tests/pacedu-teacher-two-resource-workspace.test.cjs tests/teacher-subject-class-linked-workflow.test.cjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium browser
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/pacedu-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pacedu-http.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/src/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pacedu-http.log"
          exit 1
      - name: Test desktop and phone-sized browser behaviour
        env:
          PACEDU_TEST_URL: http://127.0.0.1:4173/src/index.html?entry=welcome
          PACEDU_DEVICE_TEST_URL: http://127.0.0.1:4173/src/device-test.html
        run: npx playwright test ${{ matrix.tests }} --reporter=line
      - name: Stop local static server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pacedu-http.pid" ]; then kill "$(cat "$RUNNER_TEMP/pacedu-http.pid")" || true; fi
