name: Pacific Education Signed Android Release

on:
  workflow_dispatch:

jobs:
  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pacific-education-release.jks"
          chmod 600 "$RUNNER_TEMP/pacific-education-release.jks"
          test -s "$RUNNER_TEMP/pacific-education-release.jks"

      - name: Build signed release bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:bundleRelease
        working-directory: android

      - name: Verify AAB identity and signature
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/jarsigner.txt 2>&1
          grep -q "jar verified" /tmp/jarsigner.txt
          echo "Signed AAB verified."
          echo "Expected applicationId: org.pacificeducation.app"
          echo "Expected versionCode: 2"
          echo "Expected versionName: 1.0.1"
          keytool -list -v             -keystore "$KEYSTORE_PATH"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" |
            grep -E "Alias name:|Entry type:|SHA256:" | head -n 10

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-signed-v1.0.1
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
