name: Load Individual User Context

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  load:
    if: ${{ !contains(github.event.head_commit.message, '[skip individual context loader]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load individual user context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/pacificEducationIndividualUserContext.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit loader change
        run: |
          if git diff --quiet -- src/index.html; then
            echo "Individual user context already loaded."
            exit 0
          fi
          git config user.name "pacific-education-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html
          git commit -m "Load individual user dashboard context [skip individual context loader]"
          git push
