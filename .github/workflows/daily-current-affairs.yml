name: Pacific Education Daily Current Affairs Feed
on:
  # Run after a change to this workflow lands on main, so feed-source fixes
  # are tested immediately instead of waiting for the next scheduled run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-current-affairs.yml"
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pacedu-current-affairs-feed
  cancel-in-progress: false
jobs:
  refresh-current-affairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate official education and public-interest RSS feeds
        run: |
          set -euo pipefail
          mkdir -p docs/data
          # Use publisher feeds directly instead of GDELT, which has repeatedly
          # returned HTTP 429 or an empty {} response from shared CI runners.
          # Each source is isolated: a temporarily unavailable feed is skipped,
          # but the existing JSON is never overwritten unless eligible articles
          # are successfully collected and validated.
          declare -A feeds=(
            [unesco]="https://www.unesco.org/en/newsroom"
            [who]="https://www.who.int/rss-feeds/news-english.xml"
            [whoNewsroom]="https://www.who.int/news-room"
            [whoPacific]="https://www.who.int/westernpacific/newsroom"
            [un]="https://news.un.org/feed/subscribe/en/news/topic/sdgs/feed/rss.xml"
          )
          for source in unesco who whoNewsroom whoPacific un; do
            echo "Fetching official feed: $source"
            if curl --silent --show-error --fail --location --connect-timeout 15 --max-time 45 \
              --retry 2 --retry-all-errors --retry-delay 3 \
              --user-agent 'PacificEducationPilot/1.0 (educational current-affairs feed)' \
              --header 'Accept: application/rss+xml, application/atom+xml, application/xml, text/xml, */*' \
              "${feeds[$source]}" -o "/tmp/feed-$source.xml"; then
              echo "$source feed downloaded"
            else
              echo "::warning::Could not download $source feed; trying remaining official feeds."
              rm -f "/tmp/feed-$source.xml"
            fi
          done
          node <<'NODE'
          const fs = require('fs');
          const { URL } = require('url');
          const { execFileSync } = require('child_process');
          const sources = [
            { key: 'unesco', label: 'UNESCO', host: 'unesco.org' },
            { key: 'who', label: 'WHO', host: 'who.int' },
            { key: 'whoNewsroom', label: 'WHO Newsroom', host: 'who.int' },
            { key: 'whoPacific', label: 'WHO Western Pacific', host: 'who.int' },
            { key: 'un', label: 'UN News', host: 'un.org' }
          ];
          const allowedHosts = ['unesco.org', 'unicef.org', 'un.org', 'who.int'];
          function decode(s) {
            return String(s || '')
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
              .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
              .replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>').replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
              .replace(/&#x([\da-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
              .replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
          }
          function tag(block, name) {
            const re = new RegExp('<(?:[\\w.-]+:)?' + name + '\\b[^>]*>([\\s\\S]*?)<\\/(?:[\\w.-]+:)?' + name + '\\s*>', 'i');
            const m = block.match(re);
            return m ? decode(m[1]) : '';
          }
          function entries(xml, sourceKey) {
            const blocks = xml.match(/<(?:item|entry)\b[^>]*>[\s\S]*?<\/(?:item|entry)\s*>/gi) || [];
            if (!blocks.length && (sourceKey === 'unesco' || sourceKey === 'whoNewsroom' || sourceKey === 'whoPacific')) {
              // UNESCO's newsroom endpoint is currently HTML rather than RSS/XML.
              // Read only article links from the official newsroom and require a
              // nearby publication date; normal URL, freshness and relevance checks
              // below still apply before any item is accepted.
              const htmlItems = [];
              const anchors = [...xml.matchAll(/<a\b([^>]*?)href=["']([^"']+)["']([^>]*)>([\s\S]*?)<\/a>/gi)];
              const datePattern = /datetime=["']([^"']+)["']|\b(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})\b/gi;
              for (const m of anchors) {
                const href = m[2].replace(/&amp;/g, '&');
                const isUnescoArticle = /^(?:https:\/\/www\.unesco\.org)?\/(?:en\/)?(?:articles|news|press-releases|statements|press-invitations)\//i.test(href);
                const isWhoPacificArticle = /^(?:https:\/\/www\.who\.int)?\/westernpacific\/news\/item\//i.test(href);
                const isWhoGlobalArticle = /^(?:https:\/\/www\.who\.int)?\/news\/item\/\d{2}-\d{2}-\d{4}(?:-|\/|$)/i.test(href);
                if (!isUnescoArticle && !isWhoPacificArticle && !(sourceKey === 'whoNewsroom' && isWhoGlobalArticle)) continue;
                const titleWithDate = decode(m[4]);
                const titleDateMatch = titleWithDate.match(/\b(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4})\b/i);
                const titleDateTimestamp = titleDateMatch ? Date.parse(titleDateMatch[1]) : NaN;
                const title = titleWithDate
                  .replace(/^\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}\s*/i, '')
                  .replace(/\s+\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}\s*$/i, '')
                  .replace(/^(?:(?:joint\s+)?news release|media release|departmental update|feature story|commentary|speech)\s+/i, '')
                  .trim();
                if (!title || title.length < 12 || /^(read more|learn more|more)$/i.test(title)) continue;
                const start = Math.max(0, m.index - 450);
                const end = Math.min(xml.length, m.index + m[0].length + 700);
                const neighborhood = xml.slice(start, end);
                const dates = [];
                for (const dm of neighborhood.matchAll(datePattern)) {
                  const raw = dm[1] || dm[2];
                  const timestamp = Date.parse(raw);
                  if (Number.isFinite(timestamp)) dates.push({ raw, timestamp, distance: Math.abs(start + dm.index - m.index) });
                }
                dates.sort((a, b) => a.distance - b.distance);
                const articleUrl = new URL(href, (isWhoPacificArticle || isWhoGlobalArticle) ? 'https://www.who.int' : 'https://www.unesco.org').toString();
                // The newsroom card may expose a modified/event date. Use only
                // the linked article's explicit original publication metadata;
                // never substitute dateModified or a nearby card timestamp.
                // Prefer dates explicitly displayed on the official publisher's
                // newsroom listing. Individual UNESCO article pages may reset
                // connections from GitHub-hosted runners.
                // Keep the nearest publisher-supplied date and fail closed when
                // there is no date or equally-near dates conflict.
                let publicationTimestamp;
                const urlDate = urlPublicationDate(articleUrl);
                if ((isWhoPacificArticle || isWhoGlobalArticle) && urlDate) {
                  // WHO article URL dates represent the original publication date;
                  // RSS timestamps can reflect later updates to older articles.
                  publicationTimestamp = Date.parse(urlDate + 'T00:00:00.000Z');
                } else if (Number.isFinite(titleDateTimestamp)) {
                  // UNESCO cards often include the publication date in the same
                  // link text as the headline; prefer this direct association.
                  publicationTimestamp = Date.parse(new Date(titleDateTimestamp).toISOString().slice(0, 10) + 'T00:00:00.000Z');
                } else {
                  if (!dates.length || dates[0].distance > 700) {
                    console.warn('Skipping UNESCO newsroom item because no nearby publisher date was found: ' + articleUrl);
                    continue;
                  }
                  const nearestDistance = dates[0].distance;
                  const nearestDates = [...new Set(dates
                    .filter(value => value.distance === nearestDistance)
                    .map(value => new Date(value.timestamp).toISOString().slice(0, 10)))];
                  if (nearestDates.length !== 1) {
                    console.warn('Skipping UNESCO newsroom item because nearby publication dates conflict: ' + articleUrl);
                    continue;
                  }
                  publicationTimestamp = Date.parse(nearestDates[0] + 'T00:00:00.000Z');
                }
                if (!Number.isFinite(publicationTimestamp)) {
                  console.warn('Skipping UNESCO newsroom item with invalid newsroom date: ' + articleUrl);
                  continue;
                }
                htmlItems.push({
                  title,
                  url: articleUrl,
                  date: new Date(publicationTimestamp).toISOString(),
                  description: title
                });
              }
              const unique = new Map();
              for (const item of htmlItems) if (!unique.has(item.url)) unique.set(item.url, item);
              return [...unique.values()];
            }
            return blocks.map(b => {
              let link = tag(b, 'link');
              if (!link) {
                const m = b.match(/<link\b[^>]*href=["']([^"']+)["'][^>]*\/?\s*>/i);
                if (m) link = m[1];
              }
              return {
                title: tag(b, 'title'),
                url: link,
                date: tag(b, 'pubDate') || tag(b, 'published') || tag(b, 'date'),
                description: tag(b, 'description') || tag(b, 'summary') || tag(b, 'content')
              };
            });
          }
          function approvedUrl(value) {
            try {
              const u = new URL(String(value || ''));
              return u.protocol === 'https:' && allowedHosts.some(h => u.hostname === h || u.hostname.endsWith('.' + h));
            } catch (_) { return false; }
          }
          // Some publisher feeds expose an updated timestamp in their publication
          // field. WHO article URLs encode the original publication date as
          // /news/item/DD-MM-YYYY-...; reject any feed date that contradicts it.
          function urlPublicationDate(value) {
            try {
              const u = new URL(String(value || ''));
              if (!(u.hostname === 'who.int' || u.hostname.endsWith('.who.int'))) return null;
              const m = u.pathname.match(/\/news\/item\/(\d{2})-(\d{2})-(\d{4})(?:-|\/|$)/i);
              return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
            } catch (_) { return null; }
          }
          function dateMatchesUrlPublicationDate(value, timestamp) {
            const expected = urlPublicationDate(value);
            return !expected || new Date(timestamp).toISOString().slice(0, 10) === expected;
          }
          // Regression guard: this 2020 WHO article must never be accepted with
          // the 2026 update timestamp previously emitted by the feed.
          const whoRegressionUrl = 'https://www.who.int/news/item/27-08-2020-new-who-technical-package-health-data-for-covid-19-response';
          if (dateMatchesUrlPublicationDate(whoRegressionUrl, Date.parse('2026-10-10T07:49:45.000Z')) ||
              !dateMatchesUrlPublicationDate(whoRegressionUrl, Date.parse('2020-08-27T00:00:00.000Z'))) {
            throw new Error('WHO publication-date regression test failed.');
          }
          function subjects(text) {
            const t = String(text || '').toLowerCase(), s = [];
            if (/literacy|reading|language|english|teacher|school|education|learning/.test(t)) s.push('English');
            if (/math|mathematics|number|data|statistics/.test(t)) s.push('Mathematics');
            if (/science|health|disease|medicine|medical|diagnostic|donor|vaccine|vaccination|climate|environment|disaster|pandemic|cancer|malaria|obesity|nutrition|healthcare|maternal|reproductive|marine|ocean|biodiversity|wildlife|energy|food|hunger|cholera|agriculture|water/.test(t)) s.push('Science', 'Health Science');
            if (/technology|digital|internet|computer|artificial intelligence|\\bai\\b/.test(t)) s.push('Computer Studies');
            if (/community|society|government|poverty|displacement|children|child rights|humanitarian|aid|conflict|war|gaza|sudan|sustainable development|development gap|food security|hunger|cities|goals/.test(t)) s.push('Social Science');
            if (/place|country|climate|environment|migration|marine|ocean|biodiversity|water|energy|agriculture|cities|gaza|sudan|central african republic/.test(t)) s.push('Geography');
            if (/history|heritage|conflict|war|culture/.test(t)) s.push('History');
            if (!s.length) s.push('Social Science');
            return [...new Set(s)];
          }
          const CURRICULUM_LEVELS = ['ECE', ...Array.from({length: 13}, (_, i) => 'Class ' + (i + 1))];
          function applicableLevels(text) {
            const t = String(text || '').toLowerCase();
            // Topic-based screening suggestions only; never assert official
            // curriculum alignment. Teacher approval and age adaptation remain mandatory.
            const concrete = /children|school|education|food|water|farming|agriculture|soil|animal|wildlife|marine life|ocean|community|weather|health|blood donor|nutrition|environment|culture|sport/.test(t);
            const specialist = /diagnostic|diagnostics|coalition|policy|governance|diplomacy|conflict|war|humanitarian|economic|economy|research|data|traditional medicine|global development|leadership|sustainable development|technology|artificial intelligence|displacement|reproductive health/.test(t);
            if (concrete && !specialist) return CURRICULUM_LEVELS.slice(0, 7); // ECE–Class 6
            if (specialist) return CURRICULUM_LEVELS.slice(4); // Class 4–13
            return CURRICULUM_LEVELS.slice(3); // Class 3–13
          }
          const all = [];
          const diagnostics = {};
          for (const source of sources) {
            const counts = {
              parsed: 0, missingTitle: 0, rejectedUrl: 0, invalidDate: 0,
              tooOld: 0, futureDate: 0, urlDateMismatch: 0, irrelevant: 0, accepted: 0
            };
            diagnostics[source.label] = counts;
            const path = '/tmp/feed-' + source.key + '.xml';
            if (!fs.existsSync(path)) {
              console.warn(source.label + ': feed file missing');
              continue;
            }
            const xml = fs.readFileSync(path, 'utf8');
            const found = entries(xml, source.key);
            counts.parsed = found.length;
            console.log(source.label + ': parsed ' + found.length + ' feed entries');
            for (const a of found) {
              const title = String(a.title || '').trim();
              const url = String(a.url || '').trim();
              const publishedTime = Date.parse(String(a.date || ''));
              const now = Date.now();
              const cutoffTime = now - 180 * 24 * 60 * 60 * 1000;
              if (!title) { counts.missingTitle++; continue; }
              if (!approvedUrl(url)) { counts.rejectedUrl++; continue; }
              if (!Number.isFinite(publishedTime)) { counts.invalidDate++; continue; }
              // Treat this as current affairs, not an archive: exclude undated,
              // malformed, older-than-180-day, and future-dated items.
              if (publishedTime < cutoffTime) { counts.tooOld++; continue; }
              if (publishedTime > now + 24 * 60 * 60 * 1000) { counts.futureDate++; continue; }
              if (!dateMatchesUrlPublicationDate(url, publishedTime)) {
                counts.urlDateMismatch++;
                console.warn('Rejected feed date that conflicts with publisher URL date: ' + url +
                  ' (feed=' + new Date(publishedTime).toISOString() +
                  ', URL=' + urlPublicationDate(url) + ')');
                continue;
              }
              // Exclude navigation/noise while keeping education and broad public
              // interest stories useful for teacher-led current-affairs lessons.
              const relevance = (title + ' ' + a.description).toLowerCase();
              if (!/education|school|learning|teacher|child|children|health|healthcare|medicine|medical|diagnostic|donor|vaccine|vaccination|disease|cancer|malaria|obesity|nutrition|maternal|reproductive|science|climate|environment|culture|heritage|poverty|community|development|digital|technology|literacy|university|student|students|humanitarian|sustainable|gender|disaster|water|food|public health/.test(relevance)) {
                counts.irrelevant++;
                continue;
              }
              counts.accepted++;
              all.push({ ...a, url, title, source: source.label });
            }
            console.log(source.label + ' filter counts: ' + JSON.stringify(counts));
          }
          const seen = new Set();
          const items = all.filter(a => {
            if (seen.has(a.url)) return false;
            seen.add(a.url);
            return true;
          }).map((a, i) => {
            const combinedText = a.title + ' ' + a.description;
            const applicable = subjects(combinedText);
            const levelRecommendations = applicableLevels(combinedText);
            return {
              id: 'OFFICIAL-' + require('crypto').createHash('sha256').update(a.url).digest('hex').slice(0, 24),
              title: a.title,
              url: a.url,
              source: a.source,
              publishedAt: new Date(Date.parse(a.date)).toISOString(),
              topic: 'Education and current affairs',
              educationalRelevance: 'Potentially useful for teacher-led discussion of education, health, science, environment, culture, children, or sustainable development.',
              ageSuitability: 'Suggested levels are topic-screening guidance only; teacher must adapt language, context and task before approval.',
              subjectsApplicable: applicable,
              levelsApplicable: levelRecommendations,
              levelRecommendationBasis: 'AUTOMATED_TOPIC_SCREENING_PENDING_TEACHER_REVIEW',
              verificationStatus: 'PENDING_TEACHER_REVIEW',
              approved: false,
              sourceType: 'EDUCATIONAL_CURRENT_AFFAIRS'
            };
          }).sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt)).slice(0, 30);
          if (items.length === 0) {
            throw new Error('No eligible articles were parsed from official feeds; preserving existing feed.');
          }
          const validLevels = new Set(CURRICULUM_LEVELS);
          for (const item of items) {
            if (!Array.isArray(item.subjectsApplicable) || item.subjectsApplicable.length === 0) {
              throw new Error('Current-affairs item missing subject mapping: ' + item.url);
            }
            if (!Array.isArray(item.levelsApplicable) || item.levelsApplicable.length === 0 ||
                item.levelsApplicable.some(level => !validLevels.has(level))) {
              throw new Error('Current-affairs item has invalid Fiji level mapping: ' + item.url);
            }
            if (item.approved !== false || item.verificationStatus !== 'PENDING_TEACHER_REVIEW') {
              throw new Error('Current-affairs item must remain pending teacher review: ' + item.url);
            }
          }
          console.log('Curriculum mapping check passed: ' + items.length +
            ' items have subjects, valid ECE–Class 13 recommendations, and pending-review protection.');
          const out = {
            version: '1.0.0',
            generatedAt: new Date().toISOString(),
            source: 'UNESCO, WHO global and Western Pacific newsroom dates, WHO RSS and UN News RSS feeds; all items date- and relevance-validated',
            items
          };
          fs.writeFileSync('docs/data/current-affairs.json', JSON.stringify(out, null, 2) + '\n');
          console.log('Validated ' + items.length + ' articles; all remain pending teacher review.');
          NODE
      - name: Commit feed when changed
        run: |
          git config user.name "pacific-education-bot"
          git config user.email "actions@github.com"
          git add docs/data/current-affairs.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh daily educational current affairs feed"
          # main may advance while the feed is being generated. Rebase the
          # feed-only commit on the latest main and retry non-fast-forward
          # pushes; never force-push or auto-resolve a content conflict.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Current-affairs feed conflicts with newer main changes; refusing to overwrite."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main advanced during feed publication (attempt ${attempt}/3); retrying."
          done
          echo "::error::Could not publish feed after three safe retries."
          exit 1
