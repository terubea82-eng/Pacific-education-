name: Android Pilot Build
# Public releases must contain only the signed release APK for the installed app ID.
on:
  # Manual-only while the owner has explicitly paused all APK builds.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pacedu-public-pilot-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACIFIC_SIGNING_READY: ${{ secrets.PACIFIC_KEYSTORE_BASE64 != '' && secrets.PACIFIC_KEYSTORE_PASSWORD != '' && secrets.PACIFIC_KEY_ALIAS != '' && secrets.PACIFIC_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Restore and validate owner release keystore
        if: ${{ env.PACIFIC_SIGNING_READY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.PACIFIC_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > "${RUNNER_TEMP}/pacific-keystore.b64"
          chars=$(wc -c < "${RUNNER_TEMP}/pacific-keystore.b64")
          test "$chars" -gt 0
          test $((chars % 4)) -eq 0
          base64 --decode "${RUNNER_TEMP}/pacific-keystore.b64" > "${RUNNER_TEMP}/pacific-education-release.jks"
          test -s "${RUNNER_TEMP}/pacific-education-release.jks"
      - name: Build debug APK for testing only
        working-directory: android
        run: gradle --no-daemon clean assembleDebug
      - name: Build signed release APK and AAB
        if: ${{ env.PACIFIC_SIGNING_READY == 'true' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pacific-education-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PACIFIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PACIFIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PACIFIC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Verify signed release APK identity and signature
        if: ${{ env.PACIFIC_SIGNING_READY == 'true' }}
        working-directory: android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          badging=$("${ANDROID_HOME}/build-tools/36.0.0/aapt2" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='fj.pacificeducation.app'"
          if printf '%s\n' "$badging" | grep -Fq "package: name='fj.pacificeducation.app.debug'"; then
            echo "Refusing to publish a debug-package APK." >&2
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$apk"
      - name: Upload debug APK for testing only
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-debug-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release APK artifact
        if: ${{ env.PACIFIC_SIGNING_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release AAB artifact
        if: ${{ env.PACIFIC_SIGNING_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-aab-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Explain why public release was not published
        if: ${{ env.PACIFIC_SIGNING_READY != 'true' }}
        run: echo "::warning::Public APK release skipped because owner-controlled signing secrets are missing. The debug APK is for testing only and will not be published as an update."
      - name: Prepare verified public release APK
        if: ${{ github.ref == 'refs/heads/main' && env.PACIFIC_SIGNING_READY == 'true' }}
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p ../public-release
          cp app/build/outputs/apk/release/app-release.apk ../public-release/pacific-education.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose ../public-release/pacific-education.apk
          "${ANDROID_HOME}/build-tools/36.0.0/aapt2" dump badging ../public-release/pacific-education.apk | grep -F "package: name='fj.pacificeducation.app'"
          cd ../public-release
          sha256sum pacific-education.apk > SHA256SUMS.txt
          printf 'Commit: %s\nPackage: fj.pacificeducation.app\nBuild type: signed release APK\n' "${GITHUB_SHA}" >> SHA256SUMS.txt
      - name: Publish signed public pilot APK
        if: ${{ github.ref == 'refs/heads/main' && env.PACIFIC_SIGNING_READY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s public-release/pacific-education.apk
          PUBLIC_TAG="pilot-public-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          gh release create "$PUBLIC_TAG" public-release/pacific-education.apk public-release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Pacific Education Pilot — Signed APK ${GITHUB_SHA::12}" \
            --notes "Controlled pilot release built from ${GITHUB_SHA}. Contains only the verified signed release APK with package ID fj.pacificeducation.app. Debug APKs are never published as update packages." \
            --prerelease
