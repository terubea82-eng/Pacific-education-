name: PacEdu Defensive Technician and Security Preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacedu-defensive-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  defensive-preflight:
    name: Read-only technician and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Run PacEdu regression test suite
        run: npm test

      - name: Scan for obvious committed secrets
        run: python3 automation/scan_obvious_secrets.py

      - name: Validate local script references
        run: python3 automation/validate_local_script_references.py

      - name: Audit installed dependency tree
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high

      - name: Verify pilot remains restricted and production remains blocked
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          gate = Path("src/js/pacificEducationProductionFinalGate.js").read_text()
          readiness = Path("src/js/pacificEducationPilotReadinessSelfCheck.js").read_text()
          auth_path = Path("release/production-authorization.json")
          assert "productionApproved:false" in gate, "production must remain unapproved"
          assert "productionEligible:false" in gate, "production must remain ineligible"
          assert "failClosed:true" in gate, "production gate must fail closed"
          assert "external-specialist-approval-required" in gate, "independent review requirement missing"
          assert "365" in readiness, "daily learning range check missing"
          if auth_path.exists():
              auth = json.loads(auth_path.read_text())
              assert auth.get("productionApproved") is not True, "unexpected production approval record"
              assert auth.get("productionEligible") is not True, "unexpected production eligibility record"
          print("PASS: production stays blocked; pilot and external-review boundaries remain active.")
          PY

      - name: Publish a safe check summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PacEdu defensive preflight"
            echo
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Trigger: `$GITHUB_EVENT_NAME`"
            echo "- This workflow is read-only: it does not deploy, change permissions, access production data, or approve a release."
            echo "- CodeQL and Firebase emulator rules tests remain separate required checks."
            echo "- A passing automated run does not replace independent penetration testing, Android device testing, privacy/safeguarding review, backups/restore drills, or owner approval."
          } >> "$GITHUB_STEP_SUMMARY"
