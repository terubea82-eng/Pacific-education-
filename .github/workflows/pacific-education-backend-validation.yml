name: Pacific Education Backend Validation

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
  push:
    branches:
      - main
      - "backend/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json
      - run: npm install
      - run: node --check index.js
