<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education India Registration → GDP Pricing Test</title>
</head>

<body>

    <h1>
        Pacific Education — India Registration → GDP Pricing Test
    </h1>

    <p>
        TEST ONLY — This page does not create a production price
        or process payments.
    </p>

    <pre id="result">
Running India registration → GDP pricing test...
    </pre>

    <!-- Country Registration Bridge -->
    <script src="js/pacificEducationCountryRegistrationBridge.js"></script>

    <!-- GDP Pricing Engine -->
    <script src="js/pacificEducationAnnualGdpPricingEngine.js"></script>

    <!-- India Registration → GDP Pricing Test -->
    <script src="js/pacificEducationIndiaRegistrationGdpPricingTest.js"></script>

    <script>
        (function () {
            "use strict";

            const output =
                document.getElementById("result");

            const testResult =
                window.PacificEducationIndiaRegistrationGdpPricingTestResult;

            if (!testResult) {
                output.textContent =
                    "TEST FAILED: India registration → GDP pricing result unavailable.";
                return;
            }

            output.textContent =
                JSON.stringify(
                    testResult,
                    null,
                    2
                );
        })();
    </script>

</body>
</html>
