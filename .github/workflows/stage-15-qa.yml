# Current pilot gate verification trigger.
name: Stage 15 QA Regression

on:
  workflow_dispatch:
  push:
    paths:
      - "**.js"
      - "**.py"
      - ".github/workflows/stage-15-qa.yml"
      - "automation/**"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run Stage 15 QA
        run: python3 automation/stage15_qa.py
