name: Android Pilot Build
# Controlled pilot build: debug APK, unsigned release APK and unsigned release AAB.

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-pilot-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Download Gradle 9.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.6/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        working-directory: android
        run: gradle --version

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Build unsigned release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Build unsigned release AAB
        working-directory: android
        run: gradle --no-daemon bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pacific-education-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
