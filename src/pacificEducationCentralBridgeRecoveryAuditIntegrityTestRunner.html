<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education Central Bridge Recovery Audit Integrity Test</title>
</head>

<body>
    <h1>Pacific Education Central Bridge Recovery Audit Integrity Test</h1>

    <div id="testOutput">
        Loading test...
    </div>

    <!-- Central Bridge -->
    <script src="../js/pacificEducationCentralBridge.js"></script>

    <!-- Test-only audit integrity test -->
    <script src="pacificEducationCentralBridgeRecoveryAuditIntegrityTest.js"></script>

    <script>
        (function () {
            const output = document.getElementById("testOutput");

            if (
                !window.PacificEducationCentralBridgeRecoveryAuditIntegrityTest
            ) {
                output.innerHTML =
                    "<h2>TEST LOAD ERROR</h2>" +
                    "<p>The Recovery Audit Integrity Test could not be loaded.</p>";
                return;
            }

            const result =
                window.PacificEducationCentralBridgeRecoveryAuditIntegrityTest.run();

            let html = "";

            html += "<h2>Recovery Audit & Integrity Test</h2>";
            html += "<p><strong>Version:</strong> " +
                result.version + "</p>";
            html += "<p><strong>Status:</strong> " +
                result.status + "</p>";

            html += "<p><strong>Total:</strong> " +
                result.total + "</p>";
            html += "<p><strong>Passed:</strong> " +
                result.passed + "</p>";
            html += "<p><strong>Failed:</strong> " +
                result.failed + "</p>";

            html += "<h3>Test Results</h3>";
            html += "<ol>";

            result.tests.forEach(function (test) {
                html += "<li>" +
                    (test.passed ? "PASS" : "FAIL") +
                    " — " +
                    test.name +
                    " — " +
                    test.details +
                    "</li>";
            });

            html += "</ol>";

            html += "<h3>Recovery Information</h3>";
            html += "<pre>" +
                JSON.stringify(
                    {
                        failureId: result.failureId,
                        productionAuthorization:
                            result.productionAuthorization,
                        auditBefore: result.auditBefore,
                        auditAfter: result.auditAfter,
                        communicationAuditRecords:
                            result.communicationAuditRecords
                    },
                    null,
                    2
                ) +
                "</pre>";

            output.innerHTML = html;
        })();
    </script>
</body>
</html>
