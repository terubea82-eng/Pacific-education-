<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Education — Buy Plans Diagnostic Test</title>
</head>

<body>

<h1>Pacific Education — Buy Plans Diagnostic Test</h1>

<pre id="output">Starting test...</pre>

<script>
(function () {
    "use strict";

    const output = document.getElementById("output");

    function show(message) {
        output.textContent += "\n" + message;
    }

    show("HTML loaded successfully.");
    show("Checking JavaScript modules...");

    function loadScript(path, name, callback) {
        const script = document.createElement("script");

        script.src = path;

        script.onload = function () {
            show("OK: " + name + " loaded.");
            callback(true);
        };

        script.onerror = function () {
            show("FAILED: " + name + " could not load.");
            callback(false);
        };

        document.head.appendChild(script);
    }

    loadScript(
        "js/pacificEducationAnnualGdpPricingEngine.js",
        "Annual GDP Pricing Engine",
        function () {

            loadScript(
                "js/pacificEducationPricingAuditGuard.js",
                "Pricing Audit Guard",
                function () {

                    loadScript(
                        "js/buyPlans.js",
                        "Buy Plans",
                        function () {

                            show("");
                            show("Checking exported modules...");

                            show(
                                "GDP Engine: " +
                                (
                                    window.PacificEducationAnnualGdpPricingEngine
                                    ? "AVAILABLE"
                                    : "MISSING"
                                )
                            );

                            show(
                                "Pricing Audit Guard: " +
                                (
                                    window.PacificEducationPricingAuditGuard
                                    ? "AVAILABLE"
                                    : "MISSING"
                                )
                            );

                            show(
                                "Buy Plans: " +
                                (
                                    window.PacificEducationBuyPlans
                                    ? "AVAILABLE"
                                    : "MISSING"
                                )
                            );

                            show("");
                            show("Diagnostic test complete.");
                        }
                    );
                }
            );
        }
    );

})();
</script>

</body>
</html>
